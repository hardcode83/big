# docker-compose de DEPLOY del entorno dev — lo ejecuta el runner self-hosted EN la VM.
# A diferencia del docker-compose.yml de desarrollo: imágenes de GHCR pineadas por SHA
# (${IMAGE_TAG}), SIN `build`, SIN bind-mounts de código. postgres/redis persisten entre
# deploys (volúmenes nombrados). `backend` y `frontend` publican 8000/3000 SOLO en el loopback de la
# VM, como puerta de depuración por túnel SSH; el security list abre únicamente el 22. [R2, R5]

# --- Redes (change ingress-https-hardening) [R1] ---
# La separación en dos redes ES un control de seguridad, no un detalle de topología. Léelo antes de
# tocar la sección `networks` de cualquier servicio.
#
# EL PROBLEMA. `cloudflared` recibe su routing del edge de Cloudflare (`config_src = "cloudflare"`),
# así que quien tenga el API token puede apuntar un hostname a cualquier dirección alcanzable desde
# el contenedor del túnel y publicarla en internet — sin abrir un puerto, sin `apply`, y sin rastro
# en el tfstate hasta el siguiente `plan`. Con los siete servicios en la red `default` implícita,
# eso incluía `http://backend:8000` y `tcp://postgres:5432`.
#
# EL MECANISMO es el aislamiento **L3** entre bridges: Docker descarta el tráfico entre bridges
# distintos, así que una regla de ingress no llega a `private` ni por nombre ni por IP literal. El
# acotado del DNS es una consecuencia, no la causa.
#
# EL INVARIANTE, y tiene DOS mitades — hacen falta las dos, cada una tapa el agujero de la otra.
# **Su hogar canónico es `docs/adr/0003-https-ingress-dev.md` §Addendum 2026-08-04 §2**: lo de aquí
# es el resumen para quien edita la topología, así que si tienes que CORREGIR el invariante hazlo
# allí y actualiza este resumen — no al revés.
#   (a) PERTENENCIA: el alcance de `cloudflared` es la UNIÓN de sus redes, así que conectarlo a una
#       red más le suma todo lo que haya en ella. Por eso **el aislamiento no admite una excepción
#       por origen sin deshacerse**: meter `backend` en `ingress` "solo para el webhook" no acota
#       nada, devuelve al API token la API entera. Cualquier origen público futuro tiene que ser un
#       servicio de `ingress` que NO sea `backend`.
#   (b) REENVÍO: todo origen de `ingress` extiende el radio a lo que reenvíe hacia `private`, así
#       que (a) es necesaria pero no suficiente. Vigila la CLASE de superficie, no un campo:
#       `rewrites`, route handlers, `middleware.ts`, server actions, `images.remotePatterns` y
#       —la vía más probable— un `fetch` server-side desde un Server Component, un layout o
#       `generateMetadata`, porque `frontend/lib/config/server.ts` expone
#       `getServerConfig().backendInternalUrl` justamente para eso. Hoy `frontend` no reenvía nada y
#       ESA AUSENCIA ES PARTE DEL CONTROL — vive en `frontend/**`, que no se ve desde aquí: míralo
#       antes de dar el control por vigente. Lista completa en el ADR §2(b).
#
# QUÉ ALCANZA `cloudflared` PESE AL AISLAMIENTO. No solo el frontend: también su propio loopback
# (métricas y `/debug/pprof`, que ninguna red puede cubrir) y el host por el gateway del bridge, y
# por ahí el puerto 22, el servicio de metadatos de la instancia y la VCN enrutable. **La
# enumeración completa y autoritativa vive en UN solo sitio**, y no se copia aquí a propósito:
# `docs/adr/0003-https-ingress-dev.md` §Addendum 2026-08-04 §1. Si necesitas corregir el radio,
# corrígelo allí. Lo que sí queda cerrado aquí, y es lo que se gana: `postgres`, `redis`, `backend`,
# `worker` y `migrate` no son alcanzables.
#
# CÓMO SE RELAJA LEGÍTIMAMENTE: editando ESTE fichero (o la superficie de reenvío de un origen) y
# desplegando, es decir con un commit revisable en un Pull Request. Esa asimetría —una regla en el
# edge cuesta solo el API token; un origen nuevo alcanzable cuesta commit + deploy— es lo que este
# change entrega.
#
# CONSUMIDOR FUTURO CONOCIDO: Beds24 tiene que hacer POST contra
# `/api/v1/webhooks/{provider}/{webhook_token}` desde internet (`docs/beds24-spike.md`
# §"Consecuencia para la infraestructura"). Le aplican las dos mitades del invariante. La topología
# de ese camino se decide en la entrada `api-ingress-routing` del roadmap, NO aquí.
#
# `internal: true` NO se pone en `ingress`: cortaría su salida a internet y `cloudflared` no podría
# abrir la conexión al edge, que es justo de lo que depende el ingress.
# La dirección del `frontend` en `private`, declarada UNA vez y consumida por dos sitios: su
# `ipv4_address` más abajo, y el `--forwarded-allow-ips` del `command:` de `backend` (change
# `api-ingress-routing`, design D3/D4). El ancla es el control, no un atajo de escritura: uvicorn
# convierte EN SILENCIO cualquier valor malformado de esa lista en una comparación literal de
# cadena —su propio código comenta que el usuario no puede detectarlo—, así que un typo no fallaría:
# dejaría de confiar en nadie y el límite de 10 intentos/min contaría todo el despliegue en un solo
# contador, sin ruido. Con un único literal, un valor malformado revienta el `ipv4_address` y con él
# `compose up --wait`, o sea el deploy; y un valor válido es por construcción el mismo en las dos
# puntas. No hay deriva posible que un test tuviera que vigilar.
#
# Por qué un /32 y no la subred entera, y el motivo es MEDIDO (reparto de IPs del deploy real del
# 2026-08-08): esta red alberga `postgres` (10.89.0.2), `backend` (10.89.0.5), `frontend`
# (10.89.0.10), más `worker`, `beat` y `migrate`. Confiar en la subred autorizaría a SEIS servicios
# a reportar la dirección de un cliente cuando solo uno es el proxy.
#
# Una redacción anterior lo justificaba diciendo que Docker hace SNAT de la conexión publicada al
# gateway del bridge. Eso NO estaba medido —depende del `userland-proxy` del demonio, que este
# repositorio no fija— y es la misma afirmación que el panel de seguridad hizo corregir en el
# design; sobrevivió aquí porque la corrección aterrizó en un sitio y no en los tres.
x-frontend-private-ip: &frontend_private_ip "10.89.0.10"

networks:
  ingress:
  private:
    # IPAM explícito porque Compose lo exige para admitir `ipv4_address`; las dos mitades van
    # juntas o ninguna. La subred NO puede solaparse con la VCN `10.0.0.0/16`
    # (`infra/environments/dev/main.tf:53`, subred `10.0.1.0/24` en `:107`) ni con el pool por
    # defecto de Docker (172.17–172.31): por ahí no habría error, habría rutas que se pisan.
    #
    # AVISO: CAMBIAR ESTA SECCIÓN ROMPE EL DEPLOY SIGUIENTE. Medido en el deploy real del
    # 2026-08-08 (run 31250116992), que FALLÓ trayendo este IPAM. Compose borra y recrea la red,
    # pero solo recrea los CONTENEDORES cuya definición de servicio cambió — así que `postgres`
    # y `redis`, que no cambian, quedan adjuntos a la red borrada y el primero que intente
    # resolverlos muere con `socket.gaierror: Temporary failure in name resolution`.
    #
    # Una reproducción en un stack de prueba NO lo detecta, y una redacción anterior de este
    # comentario afirmaba por eso que `up --wait` seguía saliendo en 0: en un stack nuevo todos
    # los contenedores nacen a la vez en la red nueva. Hace falta un stack preexistente.
    #
    # Recuperación y procedimiento antes de volver a tocar `networks:`, en
    # `infra/environments/dev/RUNBOOK.md` §6.3.1.
    ipam:
      config:
        - subnet: 10.89.0.0/24

services:
  postgres:
    image: postgres:16
    networks: [private]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # sin `ports`: postgres solo es accesible en la red interna del compose (el security list no abre 5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    networks: [private]
    volumes:
      - redis_data:/data # persistente entre deploys (broker/estado Celery) — R2.1/R5.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Migraciones one-shot con la imagen PROD del backend (alembic es dep de runtime; sin `uv` en prod).
  migrate:
    image: ghcr.io/${GHCR_NS:?Falta GHCR_NS}/autohostai-backend:${IMAGE_TAG:?Falta IMAGE_TAG}
    restart: "no"
    command: alembic upgrade head
    networks: [private]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # alembic/env.py imports the ORM models, which reach app.core.config and build
      # Settings at import time; jwt_secret_key is required (R1.7), so without this
      # the migration container exits on a ValidationError and the deploy stalls on
      # `depends_on: service_completed_successfully`.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY}
      # Same reason, and it is not hypothetical: `encryption_key` is required too, so the
      # migration container would exit before applying anything.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ghcr.io/${GHCR_NS}/autohostai-backend:${IMAGE_TAG}
    restart: unless-stopped
    # Fuera de `ingress` a propósito: `cloudflared` no puede resolver `backend`, así que una regla
    # de ingress reescrita en el edge no puede publicar la API. Ver el comentario de `networks`.
    networks: [private]
    # Sobreescribe el CMD de la imagen SOLO para añadir la lista de proxies de confianza (change
    # `api-ingress-routing`, design D3). `--proxy-headers` ya viene del Dockerfile y se repite aquí
    # porque sobreescribir `command:` reemplaza el CMD entero, no lo extiende.
    #
    # Esta lista es la que decide a quién se le cree un `X-Forwarded-For`, y con ello de quién
    # cuenta el límite de 10 intentos/min (regla 7 de steering/security.md) y qué IP acaba en
    # `audit_logs.actor_ip` (regla 9). El valor sale del ancla de arriba, así que es el mismo /32
    # que `frontend` tiene asignado — no lo escribas a mano aquí.
    #
    # NUNCA `*`: sería «cree a cualquiera», y con `/api/` alcanzable desde internet eso devuelve el
    # bypass que este change existe para cerrar. Y **solo en `backend`**: `worker` y `beat` usan
    # esta misma imagen pero corren `celery`, sin servidor HTTP al que aplicar nada de esto.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - *frontend_private_ip
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY}
      APP_PROVENANCE_REPOSITORY_URL: ${APP_PROVENANCE_REPOSITORY_URL:-}
      APP_PROVENANCE_PULL_REQUEST_NUMBER: ${APP_PROVENANCE_PULL_REQUEST_NUMBER:-}
      APP_PROVENANCE_COMMIT_SHA: ${APP_PROVENANCE_COMMIT_SHA:-}
      APP_PROVENANCE_ACTIONS_RUN_ID: ${APP_PROVENANCE_ACTIONS_RUN_ID:-}
    # Publicado SOLO en loopback de la VM (R4.3): no es alcanzable desde internet ni desde la VCN,
    # pero un operador con SSH puede llegar con `ssh -L 8000:localhost:8000` (ver RUNBOOK §7.4).
    # Sin el prefijo 127.0.0.1 Docker publicaría en 0.0.0.0 y crearía una vía alternativa al túnel.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ghcr.io/${GHCR_NS}/autohostai-backend:${IMAGE_TAG}
    restart: unless-stopped
    command: celery -A app.worker worker -l info
    networks: [private]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # app.worker imports app.core.config, and jwt_secret_key is required (R1.7):
      # without this the worker crash-loops on a ValidationError.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY}
      # And the worker is where credentials get read: a job that resolves a PMS adapter per
      # property decrypts them, so the key is not optional here either.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # `up --wait` debe poder fallar el deploy si el worker no arranca (R2.4/R5) — Celery ping vía broker.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -t 5 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  beat:
    # El scheduler de `celery-jobs` (design D13). En `private` como el worker: no necesita
    # entrada desde internet, solo Redis y Postgres.
    image: ghcr.io/${GHCR_NS}/autohostai-backend:${IMAGE_TAG}
    restart: unless-stopped
    command: celery -A app.worker beat -l info
    networks: [private]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Igual que el worker: `app.worker` importa `app.core.config` y `jwt_secret_key` es
      # obligatorio (R1.7), así que sin esto el beat entra en crash-loop con un ValidationError.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY}
      # Ídem con `encryption_key`, que también es obligatorio: el beat importa la misma config.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # `celery inspect ping` NO sirve aquí: ese protocolo de control lo responde un *worker* y
    # beat no lo implementa — reutilizar el healthcheck del worker daría verde con beat muerto.
    #
    # Se comprueba PID 1, que es el propio proceso de beat (la imagen `prod` no declara
    # ENTRYPOINT, así que el `command` de arriba ES PID 1). **Con Python y no con `pgrep`**:
    # `procps` no está instalado en `python:3.12-slim` y la etapa `prod` del Dockerfile no lo
    # añade, así que `pgrep` salía 127, el `||` disparaba siempre y beat nunca habría llegado a
    # `healthy` — bloqueando `up -d --wait` y con él TODO el deploy, no solo este servicio.
    # Lo cazó el revisor de cicd del panel de la sección 5-6 ejecutándolo contra la imagen.
    #
    # Lo que prueba y lo que no: que el proceso arrancó y sigue siendo beat, que es lo que
    # `up --wait` necesita para fallar un deploy roto. NO prueba que esté planificando; si beat
    # se cuelga sin morir, esto sigue en verde. Detectarlo pediría inspeccionar su fichero de
    # planificación, y su cadencia de escritura no está garantizada por contrato.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys; sys.exit(0 if b'beat' in open('/proc/1/cmdline','rb').read() else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    image: ghcr.io/${GHCR_NS}/autohostai-frontend:${IMAGE_TAG}
    restart: unless-stopped
    # El ÚNICO servicio en las dos redes: es el origen público (lo alcanza `cloudflared` por
    # `ingress`) y está en `private` porque la app consume la API por `BACKEND_INTERNAL_URL`.
    #
    # ESTO YA NO ES «CAPACIDAD, NO USO» (change `api-ingress-routing`, R6.3). Hasta este change
    # ningún código lo ejercitaba, y el comentario que había aquí lo decía. Ahora sí:
    # `frontend/app/api/[...path]/route.ts` reenvía al backend, así que la enumeración exacta de lo
    # que este origen público reenvía hacia `private` —que es lo que exige la cláusula WHERE del
    # §Aislamiento de `sdd/specs/ingress-https-dev.md`— es:
    #
    #   • TODO `/api/` del hostname público → `${BACKEND_INTERNAL_URL}/api/`, cualquier método.
    #     Es decir: los 18 endpoints de `/api/v1` que `backend/openapi.json` publica, con su
    #     autorización intacta (`backend/tests/test_route_authorization.py` prueba ruta por ruta
    #     que todo exige Bearer salvo login, refresh y /health).
    #   • Y NADA MÁS. Ni `/openapi.json`, ni `/docs`, ni `/docs/oauth2-redirect`, ni `/redoc`, ni
    #     `/health`: son anónimos por allowlist y estaban protegidos solo por el bind a loopback,
    #     así que quedan fuera del alcance del reenvío a propósito, con test que lo fija
    #     (`frontend/app/proxy-scope.test.ts`).
    #
    # Sigue siendo el único puente `ingress`→`private`, o sea el vector de crecimiento del
    # invariante de arriba. Si añades otro reenvío, la lista de aquí arriba deja de ser verdad.
    #
    # La puerta de salida por defecto NO se pinea, a propósito: el campo que la gobierna es
    # `gw_priority` (`priority` solo ordena la conexión a las redes, no elige gateway). El servidor
    # de Next SÍ hace ya llamadas salientes —el reenvío de arriba—, pero van a `backend` por nombre
    # dentro de `private`, no a internet, así que no dependen del gateway elegido. Si algún día
    # hiciera una llamada a internet y el gateway importara, el campo es `gw_priority`.
    networks:
      ingress:
      private:
        # Fija, y es la mitad de la lista de confianza del `backend` de arriba (design D4). Si la
        # cambias, cambia el ancla — nunca este valor a mano.
        ipv4_address: *frontend_private_ip
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      # Next standalone (server.js) usa $HOSTNAME como dirección de bind; Docker lo pone al
      # container-id → escucharía en una IP no-localhost. Forzar 0.0.0.0 para que escuche en
      # todas las interfaces (healthcheck local + puerto publicado 3000).
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    # Publicado SOLO en loopback de la VM (R4.3). Desde internet el único camino sigue siendo el
    # túnel, que llega por la red interna como `http://frontend:3000`; el binding a loopback existe
    # para depuración por túnel SSH (`ssh -L 3000:localhost:3000`, ver RUNBOOK §7.4) y permite abrir
    # la app en el navegador sin pasar por Cloudflare, que es como se distingue un fallo de la app
    # de un fallo del edge o del túnel.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Ingress HTTPS (change ingress-https-dev). Abre una conexión SALIENTE al edge de Cloudflare, que
  # termina TLS y entrega a frontend:3000 por esta misma red interna. Por eso NO publica puertos y
  # el security list de la VM no necesita 80/443. El routing (qué hostname va a qué servicio) vive
  # en Terraform, no aquí: config_src = "cloudflare".
  cloudflared:
    # Pineada por dígest del índice multi-arch (incluye linux/arm64, la arquitectura de la VM).
    # Corresponde a la release 2026.7.3, resuelta del registry el 2026-07-29.
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # SOLO `ingress`, y esta lista de UN elemento es el control: es lo que impide que el routing
    # remoto del túnel publique `postgres`, `redis` o `backend`. **No añadir aquí ninguna otra red**
    # — por la mitad (a) del invariante, sumar una red suma todo lo que haya en ella. Lo que el
    # aislamiento NO cubre está enumerado en ADR 0003 §Addendum 2026-08-04 §1, no aquí.
    networks: [ingress]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Falta TUNNEL_TOKEN}
      # Habilita el endpoint de métricas en loopback, que es lo que consulta `tunnel ready`.
      # Sin esto el healthcheck no tiene a quién preguntar.
      TUNNEL_METRICS: 127.0.0.1:2000
    depends_on:
      # No anunciar al edge un origen que todavía no responde (R2.5): si cloudflared arrancara antes
      # que el frontend, el edge devolvería 502 durante la ventana de arranque.
      frontend:
        condition: service_healthy
    # La imagen es distroless: sin shell, sin curl y sin wget, así que un healthcheck HTTP al uso no
    # es posible. cloudflared trae su propio subcomando, que consulta el endpoint de métricas de
    # arriba y solo devuelve 0 si el túnel tiene conexión establecida con el edge (design D5).
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
