name: rule11-ownership

# La propiedad de un sumidero de la regla 11 se declara en la tabla de `sdd/steering/security.md`
# y en ningún otro sitio, y eso lo hace cumplir un test y no la buena voluntad. Este workflow
# existe porque el test estaba, y **no se ejecutaba donde tenía que hablar**.
#
# El defecto, medido y no inferido: la guardia vivía en `backend/tests/`, y `backend-tests.yml`
# decide el área del diff con `case "$f" in backend/* | .github/workflows/backend-tests.yml)`, así
# que un commit de **sola prosa** —que es exactamente la forma de todo commit de `/sdd:archive`—
# no ejecutaba la suite que la contiene. Su entrada (`sdd/**`, `docs/**`, los `.py` del backend) y
# su gatillo eran conjuntos disjuntos. En el run 33409418091 de `main`, sobre el commit `f86a83f`
# que introdujo tres bloques infractores: `backend-tests-detect` success, `backend-tests` success,
# `backend-tests-suite` **skipped**. `main` verde en CI y rojo en local, y el rojo le habría caído
# a la siguiente PR que tocara `backend/**` sin haberlo escrito.
#
# --- Por qué son tres jobs (change `ci-pr-gates-optimization`) ---
#
# Hasta este change era un único job que corría SIEMPRE, sin filtro de área dentro (D2 original):
# el escaneo tarda ~1 s sobre ~900 ficheros, así que no había nada que ahorrar filtrando. Ese
# razonamiento envejeció junto con el resto del repo — `check-rule11-ownership` y su suite han
# crecido, y de los PR que no tocan ninguna de las rutas vigiladas el resultado no puede decir
# nada nuevo. `ci-pr-gates-optimization` adopta aquí el mismo patrón que `backend-tests.yml`:
#
#   rule11-ownership-detect  decide si el diff toca el área      (siempre corre, ~segundos)
#   rule11-ownership-suite   la verificación de verdad           (corre si toca)
#   rule11-ownership         consolida y reporta                 (siempre corre)
#
# **SIN `paths:` en `on:`** (R1.2), prohibido por `sdd/specs/backend-ci.md`: un filtro de rutas a
# nivel de disparador no produce check alguno en los PR que no tocan esas rutas, y un required
# check con filtro deja esos PR esperando para siempre uno que no llegará. Lo que se ha movido es
# *dónde* se decide: del disparador (donde condicionar implica no reportar) al interior de la
# ejecución (donde se puede condicionar el trabajo y reportar igualmente).
#
# `push: branches: [main]` no es decorativo: es lo que habría puesto en rojo aquel run.
#
# **Sin Postgres, sin Redis, sin `.env` y sin secrets** (R1.3), y eso es verificable leyendo este
# fichero, que es el punto. La guardia es stdlib (`ast`, `re`, `pathlib`) y sólo lee ficheros del
# árbol, así que va con el `python3` del runner. `uv` entra únicamente para el paso de la suite.
#
# El check run toma el nombre del JOB, no del workflow. `rule11-ownership` es por tanto el único
# contexto marcable como obligatorio, distinto del de `backend-tests`; `rule11-ownership-suite`
# se salta de forma legítima y marcarlo reproduciría el bloqueo indefinido por otra puerta.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: rule11-ownership-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- ¿Hay que ejecutar la suite? Se decide una vez, aquí, y se publica. -----------
  # Sin dependencias: solo git. Es el job que hace que el camino corto cueste segundos.
  rule11-ownership-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rule11: ${{ steps.decide.outputs.rule11 }}
      reason: ${{ steps.decide.outputs.reason }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historia completa: el diff se calcula contra la base del PR (o el estado
          # anterior de `main`), y un clon shallow no la contiene.
          fetch-depth: 0
          # Los pasos posteriores no necesitan Git autenticado.
          persist-credentials: false

      # Invariante temporal (design D1.1.c): la superficie de detección de ESTE job debe cubrir
      # toda la superficie que la guardia recorre (`SCOPE`) más lo que la suite ejecuta. Corre
      # SIEMPRE y ANTES de `decide` (fuera de su `set +e`, bajo el `bash -e` por defecto), así que
      # si aparece un subárbol nuevo bajo `sdd/` que la guardia caminaría pero ninguna ancla
      # nombra, este paso ABORTA el job en el mismo PR que abre la brecha —no un PR después—. Un
      # fallo aquí es un error de configuración del gate: el consolidador lo ve como
      # `DETECT_RESULT != success` y reporta **fail-closed** (rojo), distinto del fail-open ante un
      # diff ambiguo. Generaliza la invariante F4 (test D1.1.a) al enforcement always-run. Stdlib
      # puro (`python3` del runner, sin `uv`).
      - name: Verificar superficie de detección
        run: python3 scripts/check-detect-surface.py rule11

      - name: ¿El diff toca alguna ruta vigilada por la regla 11?
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        # Aquí un fallo inesperado NO debe abortar el paso: si el diff no se puede
        # determinar, el requisito (R5.4) es ejecutar la suite completa, no dejar el
        # check en rojo — la duda se resuelve verificando. Por eso cada comando que
        # puede fallar se comprueba explícitamente y `rule11` arranca en `true`: solo
        # una ruta afirmativa lo baja a `false`.
        run: |
          # `set +e` explícito porque GitHub invoca los `run:` con `bash -e {0}`: `-e`
          # está activo por defecto y un `set -uo pipefail` NO lo desactiva.
          #
          # Es una medida defensiva, no la que hace funcionar el fail-open de R5.4 hoy.
          # Comprobado: `-e` queda suspendido en todo el cuerpo de una función invocada
          # como test de un `if`/`elif` (o negada con `!`), y ahora mismo TODOS los
          # comandos que pueden fallar —`git cat-file`, `read_diff`— se invocan así, de
          # modo que ya degradaban correctamente sin esta línea. Lo que `set +e` cubre es
          # el futuro: el día que alguien añada aquí un comando fuera de un condicional,
          # su fallo abortaría el paso y el gate reportaría rojo en vez de caer al camino
          # completo, que es lo contrario de lo que R5.4 pide.
          set +e
          set -uo pipefail

          rule11=true
          reason="unknown-event-defaults-to-full-suite"
          files=()

          # `core.quotePath=false` y `-z` no son cosmética. Por defecto git ESCAPA las
          # rutas no ASCII y las envuelve en comillas, con lo que un patrón anclado no
          # casa: un PR cuyo único cambio fuese un fichero con acento se saltaría la
          # suite y el check saldría VERDE. Con el quoting desactivado las rutas llegan
          # literales, y `-z` las separa por NUL, que es lo único seguro con nombres que
          # llevan espacios o saltos de línea.
          # `--no-renames` NO es un detalle de rendimiento. Git detecta renombrados por
          # defecto, y con `--name-only` un movimiento COLAPSA a una sola línea con la
          # ruta destino. Sin este flag, un PR que saca un módulo DE una ruta vigilada se
          # juzga «no toca el área», se salta la suite y el check sale VERDE. Con el
          # flag salen ambas rutas.
          read_diff() {
            local out rc
            out="$(mktemp)"
            git -c core.quotePath=false diff -z --no-renames --name-only "$@" >"$out" 2>/dev/null
            rc=$?
            if [ "$rc" -eq 0 ]; then
              mapfile -d '' -t files <"$out"
            fi
            rm -f "$out"
            return "$rc"
          }

          # Comparación ruta a ruta con `case`, no un regex sobre el conjunto pegado:
          # evita escapar el punto de `.github` y hace imposible un acierto parcial.
          evaluate() {
            local f
            for f in "${files[@]}"; do
              case "$f" in
                sdd/steering/* | sdd/specs/* | sdd/project.md | sdd/README.md | sdd/metrics.md | docs/* | backend/app/* | backend/alembic/versions/* | backend/tests/* | scripts/* | Makefile | .github/workflows/rule11-ownership.yml)
                  rule11=true
                  reason="diff-touches-rule11"
                  return
                  ;;
              esac
            done
            rule11=false
            reason="no-rule11-changes"
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              # Vía de escape deliberada: una ejecución manual siempre verifica todo.
              reason="workflow-dispatch-runs-full-suite"
              ;;

            pull_request)
              if [ -z "${PR_BASE_SHA:-}" ] || [ -z "${PR_HEAD_SHA:-}" ]; then
                reason="pr-shas-missing"
              elif ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
                reason="pr-base-unreachable"
              # Tres puntos, no dos: interesan los cambios de la rama desde el ancestro
              # común. Con dos puntos, fusionar `main` en la rama dispararía la suite
              # sin que el PR haya tocado el área.
              elif ! read_diff "${PR_BASE_SHA}...${PR_HEAD_SHA}"; then
                reason="git-diff-failed"
              else
                evaluate
              fi
              ;;

            push)
              if [ -z "${PUSH_BEFORE:-}" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                # Rama nueva o primer push: no hay estado anterior con el que comparar.
                reason="push-before-is-zero"
              elif ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                # Force-push: el commit anterior ya no es alcanzable.
                reason="push-before-unreachable"
              elif ! read_diff "${PUSH_BEFORE}" "${PUSH_AFTER}"; then
                reason="git-diff-failed"
              else
                evaluate
              fi
              ;;
          esac

          {
            echo "rule11=${rule11}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"

          # A stdout además del output: `$GITHUB_OUTPUT` es un canal entre jobs y no
          # imprime nada en el log, y el resumen lo escribe el job consolidador. Sin
          # esto la decisión no sería visible donde se toma. Ambos valores salen de un
          # conjunto cerrado de literales de este script, así que no son inyectables.
          echo "::notice::rule11=${rule11} (${reason})"

          if [ "${#files[@]}" -gt 0 ]; then
            echo "Ficheros cambiados considerados (${#files[@]}):"
            # `%q` y el prefijo son contención, no formato. Quien abre el PR elige los
            # nombres de fichero, y un nombre puesto al principio de una línea del log
            # lo ejecuta el runner como comando de workflow (`::notice::`, `::error::`,
            # `::add-mask::`, `::stop-commands::`): permitiría falsificar la anotación de
            # la decisión, o silenciar el resto del log.
            #
            # El prefijo de dos espacios NO basta por sí solo: un nombre de fichero puede
            # contener SALTOS DE LÍNEA, y con `-z` llegan crudos, así que el prefijo solo
            # protegería la primera línea y las demás empezarían en la columna 0. `%q`
            # colapsa cada ruta a una sola línea, con lo que el prefijo vuelve a
            # cubrirla entera — y de paso el tope de 50 pasa a contar líneas de verdad y
            # no elementos que pueden expandirse a muchas.
            printf '  %q\n' "${files[@]:0:50}"
          fi

  # --- La verificación de verdad. Intacta respecto a antes del change, salvo el ------
  # `needs`/`if` de arriba y el nombre del job. Solo corre cuando el detector afirma
  # que el diff toca el área.
  rule11-ownership-suite:
    needs: rule11-ownership-detect
    if: needs.rule11-ownership-detect.outputs.rule11 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Checkout por defecto, es decir `fetch-depth: 1`: **el árbol de trabajo llega completo** y
      # la profundidad del historial es irrelevante para esta guardia, que lee ficheros y no
      # commits. No se pone `fetch-depth: 0` a propósito: no compraría nada y clonaría el
      # historial entero en cada PR. Lo que un checkout truncado provocaría —menos ficheros de los
      # que hay— lo caza el centinela de suelo mínimo (`MINIMUM_MARKDOWN_FILES`,
      # `MINIMUM_PYTHON_FILES`), que es su motivo de existir.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Sólo para el paso de la suite. Misma acción y mismo SHA que `compose-ports.yml`,
      # `api-contract.yml` y `backend-tests.yml`.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: La propiedad de un sumidero se declara en un solo sitio
        # El mismo target que se ejecuta en local y el mismo script: un workflow con su propia
        # invocación fallaría por un motivo que nadie puede reproducir en su máquina.
        run: make check-rule11-ownership

      - name: La suite de la guardia
        # Si la guardia deja de detectar lo que dice detectar, esto rompe el check. Va aquí además
        # de en `compose-ports.yml` —cuyo paso `pytest scripts/ -q` también las recoge— porque
        # depender de que otro workflow ejecute tus pruebas es la misma clase de acoplamiento que
        # este change existe para deshacer.
        #
        # `--no-project` porque no hay `pyproject.toml` en la raíz y no queremos sincronizar el
        # árbol de dependencias del backend para probar un script de la stdlib; el `pytest` va
        # **pinneado** y alineado con el `pytest>=9.1.1` de `backend/pyproject.toml`.
        run: uv run --no-project --with 'pytest==9.1.1' python -m pytest scripts/test_rule11_ownership.py -q

  # --- El check que se reporta. SIEMPRE se ejecuta: es el invariante del gate. ------
  # Este nombre de job es el contexto que ve GitHub, así que no se renombra sin romper
  # cualquier selección de check obligatorio.
  rule11-ownership:
    needs: [rule11-ownership-detect, rule11-ownership-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Consolidar el resultado del gate
        env:
          DETECT_RESULT: ${{ needs.rule11-ownership-detect.result }}
          SUITE_RESULT: ${{ needs.rule11-ownership-suite.result }}
          RULE11: ${{ needs.rule11-ownership-detect.outputs.rule11 }}
          REASON: ${{ needs.rule11-ownership-detect.outputs.reason }}
        # Los casos se enumeran uno a uno en vez de escribir un `!= 'failure'`
        # abreviado: esa forma daría verde ante una cancelación y ante un job de
        # detección roto, que son precisamente los dos falsos verdes que hay que
        # evitar. Mismo criterio que la consolidación de `backend-tests.yml`,
        # `frontend-tests.yml` y `compose-ports.yml`.
        run: |
          set -euo pipefail

          if [ "$DETECT_RESULT" != "success" ]; then
            verdict=fail
            detail="el job de detección terminó en '${DETECT_RESULT}', así que no se sabe si la suite hacía falta"
            suite_line="no ejecutada"
          elif [ "$SUITE_RESULT" = "success" ]; then
            verdict=pass
            detail="la suite se ejecutó completa y pasó"
            suite_line="ejecutada y verde"
          elif [ "$SUITE_RESULT" = "skipped" ]; then
            if [ "$RULE11" = "false" ]; then
              verdict=pass
              detail="el diff no toca ninguna ruta vigilada por la regla 11 ni este workflow, así que la suite NO se ejecutó"
              suite_line="**OMITIDA** (no ejecutada)"
            else
              # No debería poder ocurrir: si hacía falta, no se salta. Si pasa, es un
              # bug del gate y no un PR válido.
              verdict=fail
              detail="incoherencia del gate: la suite se saltó con rule11='${RULE11}'"
              suite_line="omitida indebidamente"
            fi
          else
            verdict=fail
            detail="la suite terminó en '${SUITE_RESULT}'"
            suite_line="${SUITE_RESULT}"
          fi

          {
            echo "## rule11-ownership"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Veredicto | ${verdict} |"
            echo "| Suite de rule11-ownership | ${suite_line} |"
            echo "| Decisión de área | \`${RULE11:-desconocida}\` (\`${REASON:-sin razón}\`) |"
            echo ""
            echo "${detail}"
            if [ "$suite_line" = "**OMITIDA** (no ejecutada)" ]; then
              echo ""
              echo "> Este check está verde porque **no había nada que verificar**, no porque"
              echo "> la suite haya pasado. Un PR que toque una ruta vigilada la ejecuta entera."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict" != "pass" ]; then
            echo "::error::${detail}"
            exit 1
          fi
          echo "::notice::${detail}"
