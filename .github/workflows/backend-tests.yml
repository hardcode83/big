name: backend-tests

# Merge gate reproducible para el backend, pedido en la revisión del PR #25: hasta
# ahora la suite solo existía en la máquina de quien la ejecutaba, así que "1166
# verdes" no era evidencia que nadie más pudiera reproducir. Ejecuta lo mismo que
# `sdd/project.md` manda ejecutar en local, en un entorno limpio:
#
#   1. migraciones Alembic sobre un PostgreSQL recién creado (no `create_all`, que es
#      lo que usa la suite y por tanto no probaría la cadena real de migraciones);
#   2. `alembic check`, que falla si los modelos y el esquema han divergido;
#   3. la suite completa, que incluye los tests de auth, rotación, revocación, RBAC y
#      aislamiento por tenant.
#
# --- Por qué son tres jobs y no uno (change `ci-backend-tests-conditional-gate`) ---
#
# La suite tarda **~4m03s** (mediana de tres ejecuciones, medida el 2026-08-10 sobre
# `sdd/backend-suite-runtime`; el paso dominante sigue siendo el de `pytest`). La misma
# medición sobre `main` ese día dio **15m54s**: la diferencia es el change
# `backend-suite-runtime`, que dejó de construir y tirar el esquema en cada test.
#
# Esta cifra ha mentido dos veces ya, y las dos por lo mismo —envejeció sin que nada
# fallara—. Primero afirmó "~1 minuto" y sobre ella se decidió ejecutar la suite en todos
# los PR, cuando era seis veces menor que la realidad; después "~6m15s" del 2026-08-03,
# que en seis días se había quedado corta 2,5×. Por eso ahora hay un presupuesto declarado
# más abajo y el check lo compara en cada ejecución: para que la próxima deriva se vea en
# el propio resumen y no seis días tarde.
#
# Como de los PR que no tocan `backend/**` la suite no puede decir nada nuevo —es
# hermética a ese directorio, ver `sdd/specs/backend-ci.md`—, ahora solo se ejecuta
# cuando el diff toca el backend. Pero el check se sigue reportando SIEMPRE:
#
#   backend-tests-detect  decide si el diff toca el área      (siempre corre, ~20s)
#   backend-tests-suite   la verificación de verdad           (corre si toca, ~4m30s)
#   backend-tests         consolida y reporta                 (siempre corre)
#
# SIGUE PROHIBIDO poner `paths:` en `on:`, y la razón original no ha cambiado: con un
# filtro en el disparador el workflow **no arranca**, así que un check requerido nunca
# reporta y GitHub deja el PR bloqueado esperando para siempre. Lo que se ha movido es
# *dónde* se decide: del disparador (donde condicionar implica no reportar) al interior
# de la ejecución (donde se puede condicionar el trabajo y reportar igualmente).
#
# El check run toma el nombre del JOB, no del workflow. `backend-tests` es por tanto el
# único contexto marcable como obligatorio; `backend-tests-suite` se salta de forma
# legítima y marcarlo reproduciría el bloqueo indefinido por otra puerta.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# --- Presupuesto de tiempo de la suite (change `backend-suite-runtime`, R4.1, D7) ---
#
# Dato versionado y revisable en el diff, nunca un ajuste de la UI de GitHub: la norma
# IaC-first de `steering/infra.md` vale también para los umbrales del propio gate.
#
# Son DOS cifras y no una a propósito. Un solo umbral obliga a elegir entre convertir la
# variabilidad del runner —±20-30 %— en bloqueos de merge, o publicar un aviso que nadie
# mira. Así que: pasar el presupuesto emite un aviso destacado en el resumen, y solo pasar
# el techo pone el check en rojo.
#
# No sustituyen a `timeout-minutes: 20` del job, que es otra cosa: una guillotina cuyo
# incumplimiento se lee como avería de infraestructura, no como regresión de rendimiento.
env:
  BACKEND_SUITE_BUDGET_SECONDS: "300"   # 5m00s — objetivo de R2.1; pasarlo avisa
  BACKEND_SUITE_CEILING_SECONDS: "450"  # 7m30s — pasarlo pone el check en rojo

jobs:
  # --- ¿Hay que ejecutar la suite? Se decide una vez, aquí, y se publica. -----------
  # Sin `services:` ni dependencias: solo git. Es el job que hace que el camino corto
  # cueste segundos en vez de siete minutos.
  backend-tests-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      reason: ${{ steps.decide.outputs.reason }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historia completa: el diff se calcula contra la base del PR (o el estado
          # anterior de `main`), y un clon shallow no la contiene.
          fetch-depth: 0
          # Los pasos posteriores no necesitan Git autenticado.
          persist-credentials: false

      - name: ¿El diff toca el backend?
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        # Aquí un fallo inesperado NO debe abortar el paso: si el diff no se puede
        # determinar, el requisito (R2.4) es ejecutar la suite completa, no dejar el
        # check en rojo — la duda se resuelve verificando. Por eso cada comando que
        # puede fallar se comprueba explícitamente y `backend` arranca en `true`: solo
        # una ruta afirmativa lo baja a `false`.
        run: |
          # `set +e` explícito porque GitHub invoca los `run:` con `bash -e {0}`: `-e`
          # está activo por defecto y un `set -uo pipefail` NO lo desactiva.
          #
          # Es una medida defensiva, no la que hace funcionar el fail-open de R2.4 hoy.
          # Comprobado: `-e` queda suspendido en todo el cuerpo de una función invocada
          # como test de un `if`/`elif` (o negada con `!`), y ahora mismo TODOS los
          # comandos que pueden fallar —`git cat-file`, `read_diff`— se invocan así, de
          # modo que ya degradaban correctamente sin esta línea. Lo que `set +e` cubre es
          # el futuro: el día que alguien añada aquí un comando fuera de un condicional,
          # su fallo abortaría el paso y el gate reportaría rojo en vez de caer al camino
          # completo, que es lo contrario de lo que R2.4 pide.
          set +e
          set -uo pipefail

          backend=true
          reason="unknown-event-defaults-to-full-suite"
          files=()

          # `core.quotePath=false` y `-z` no son cosmética. Por defecto git ESCAPA las
          # rutas no ASCII y las envuelve en comillas —`"backend/caf\303\251.py"`—, con
          # lo que un patrón anclado en `^backend/` no casa: un PR cuyo único cambio de
          # backend fuese un fichero con acento se saltaría la suite y el check saldría
          # VERDE. Con el quoting desactivado las rutas llegan literales, y `-z` las
          # separa por NUL, que es lo único seguro con nombres que llevan espacios o
          # saltos de línea.
          # `--no-renames` NO es un detalle de rendimiento. Git detecta renombrados por
          # defecto, y con `--name-only` un movimiento COLAPSA a una sola línea con la
          # ruta destino: mover `backend/app/x.py` a `shared/x.py` sale solo como
          # `shared/x.py`. Sin este flag, un PR que saca un módulo DE `backend/` se
          # juzga «no toca el backend», se salta la suite y el check sale VERDE — con
          # código del backend desaparecido. Con el flag salen ambas rutas.
          read_diff() {
            local out rc
            out="$(mktemp)"
            git -c core.quotePath=false diff -z --no-renames --name-only "$@" >"$out" 2>/dev/null
            rc=$?
            if [ "$rc" -eq 0 ]; then
              mapfile -d '' -t files <"$out"
            fi
            rm -f "$out"
            return "$rc"
          }

          # Comparación ruta a ruta con `case`, no un regex sobre el conjunto pegado:
          # evita escapar el punto de `.github` y hace imposible un acierto parcial.
          evaluate() {
            local f
            for f in "${files[@]}"; do
              case "$f" in
                backend/* | .github/workflows/backend-tests.yml)
                  backend=true
                  reason="diff-touches-backend"
                  return
                  ;;
              esac
            done
            backend=false
            reason="no-backend-changes"
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              # Vía de escape deliberada: una ejecución manual siempre verifica todo.
              reason="workflow_dispatch-runs-full-suite"
              ;;

            pull_request)
              if [ -z "${PR_BASE_SHA:-}" ] || [ -z "${PR_HEAD_SHA:-}" ]; then
                reason="pr-shas-missing"
              elif ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
                reason="pr-base-unreachable"
              # Tres puntos, no dos: interesan los cambios de la rama desde el ancestro
              # común. Con dos puntos, fusionar `main` en la rama dispararía la suite
              # sin que el PR haya tocado el backend.
              elif ! read_diff "${PR_BASE_SHA}...${PR_HEAD_SHA}"; then
                reason="git-diff-failed"
              else
                evaluate
              fi
              ;;

            push)
              if [ -z "${PUSH_BEFORE:-}" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                # Rama nueva o primer push: no hay estado anterior con el que comparar.
                reason="push-before-is-zero"
              elif ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                # Force-push: el commit anterior ya no es alcanzable.
                reason="push-before-unreachable"
              elif ! read_diff "${PUSH_BEFORE}" "${PUSH_AFTER}"; then
                reason="git-diff-failed"
              else
                evaluate
              fi
              ;;
          esac

          {
            echo "backend=${backend}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"

          # A stdout además del output: `$GITHUB_OUTPUT` es un canal entre jobs y no
          # imprime nada en el log, y el resumen lo escribe el job consolidador. Sin
          # esto la decisión no sería visible donde se toma. Ambos valores salen de un
          # conjunto cerrado de literales de este script, así que no son inyectables.
          echo "::notice::backend=${backend} (${reason})"

          if [ "${#files[@]}" -gt 0 ]; then
            echo "Ficheros cambiados considerados (${#files[@]}):"
            # `%q` y el prefijo son contención, no formato. Quien abre el PR elige los
            # nombres de fichero, y un nombre puesto al principio de una línea del log
            # lo ejecuta el runner como comando de workflow (`::notice::`, `::error::`,
            # `::add-mask::`, `::stop-commands::`): permitiría falsificar la anotación de
            # la decisión que R2.1 exige, o silenciar el resto del log.
            #
            # El prefijo de dos espacios NO basta por sí solo: un nombre de fichero puede
            # contener SALTOS DE LÍNEA, y con `-z` llegan crudos, así que el prefijo solo
            # protegería la primera línea y las demás empezarían en la columna 0. `%q`
            # colapsa cada ruta a una sola línea (`$'backend/z\n::error::…'`), con lo que
            # el prefijo vuelve a cubrirla entera — y de paso el tope de 50 pasa a contar
            # líneas de verdad y no elementos que pueden expandirse a muchas.
            printf '  %q\n' "${files[@]:0:50}"
          fi

  # --- La verificación de verdad. Intacta respecto a antes del change, salvo el ------
  # `needs`/`if` de arriba y el nombre del job.
  backend-tests-suite:
    needs: backend-tests-detect
    if: needs.backend-tests-detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    outputs:
      # Segundos que tardó el paso de `pytest`, para que el job que reporta pueda
      # contrastarlos con el presupuesto sin hacer `checkout` ni llamar a la API.
      pytest_seconds: ${{ steps.suite.outputs.seconds }}

    # Postgres Y Redis. Redis no es opcional: tests/auth/test_throttle.py prueba el
    # adaptador de Redis a propósito SIN skip (es la única implementación de
    # producción de R5.1-R5.4), así que sin este servicio esos tests van a rojo en vez
    # de desaparecer en el contador de skips.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autohostai
          POSTGRES_USER: autohostai
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autohostai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://autohostai:ci-local-only@localhost:5432/autohostai
      REDIS_URL: redis://localhost:6379/0
      # El nombre de la base de datos por-run de la suite (tests/db_names.py) sale del
      # pid; fijarlo aquí lo hace legible en los logs y reproducible al reintentar.
      PYTEST_DB_SUFFIX: ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Generar una clave JWT de usar y tirar
        # Generada en cada ejecución en vez de escrita en el repo o guardada como
        # secret: `settings` exige >=32 caracteres al importar (R1.7), pero esta clave
        # no firma nada que salga del job. Mismo criterio que `make up` en local, y así
        # no hay ningún valor con pinta de secreto versionado (steering/security.md #8).
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Generar una clave de cifrado de usar y tirar
        # Mismo criterio que la clave JWT de arriba, y por el mismo motivo: `encryption_key`
        # es obligatoria al importar `settings`, así que sin esto fallan la suite Y las
        # migraciones. La forma NO es la misma: Fernet exige base64url de 32 bytes, y un
        # `rand -hex 32` lo rechaza el validador de `config.py`.
        run: echo "ENCRYPTION_KEY=$(openssl rand 32 | base64 | tr '+/' '-_' | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        working-directory: backend
        run: uv sync --frozen

      - name: Migraciones sobre PostgreSQL limpio
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Los modelos coinciden con el esquema migrado
        working-directory: backend
        run: uv run alembic check

      - name: Suite completa (incluye auth, RBAC y aislamiento por tenant)
        id: suite
        working-directory: backend
        # `-n 4`: número declarado, no `-n auto`. Hoy `auto` daría 4 en `ubuntu-latest`, pero
        # mañana daría lo que el runner traiga, y el aislamiento de Redis por worker tiene un
        # techo de 16 bases lógicas (`tests/conftest.py`). El número se declara y se revisa en
        # el diff, como las dos cifras del presupuesto.
        #
        # Cada worker se lleva su propia base de datos desechable (`…_test_ci_gw0`, ver
        # `tests/db_names.py`) y su propia base lógica de Redis, que es lo que hace que esto
        # no sea compartir estado entre cuatro procesos.
        #
        # En local la suite sigue siendo **en serie** por defecto: quien quiera paralelo pasa
        # `-n` por la línea de órdenes, y la salida en serie es la legible para `pytest -k`.
        # Cronometrado aquí dentro, y no restando marcas de tiempo de la API de GitHub,
        # porque la duración tiene que existir **aunque `pytest` falle**: el paso captura
        # el código de salida, publica los segundos y solo después se rinde con él.
        #
        # `set +e` explícito, y por la misma razón que lo lleva el job de detección más
        # arriba: GitHub invoca los `run:` con `bash -e {0}`, así que `-e` está activo por
        # defecto y un `set -uo pipefail` NO lo desactiva. Sin esta línea el paso abortaría
        # en el propio `pytest` y las dos siguientes no llegarían a ejecutarse — es decir,
        # la duración faltaría exactamente en el caso que esto existe para cubrir, y el
        # resumen diría «no llegó» sobre una suite que sí se midió.
        run: |
          set -uo pipefail
          # El número de workers de abajo solo tiene sentido contra esto, y el runner no lo
          # publica en ninguna parte del log. Dejarlo escrito evita tener que adivinarlo la
          # próxima vez que alguien quiera ajustar `-n`.
          echo "runner: $(nproc) vCPU, $(free -g | awk '/^Mem:/ {print $2}') GB"
          started=$(date +%s)

          set +e
          uv run pytest -q -rs -n 4
          status=$?
          set -e

          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Las migraciones se pueden deshacer hasta la base
        working-directory: backend
        # `downgrade base` no lo cubre la suite (test_migrations.py desanda revisión a
        # revisión hasta la anterior a este change, no hasta cero) y es lo que un
        # operador ejecuta cuando un deploy sale mal.
        run: uv run alembic downgrade base

  # --- El check que se reporta. SIEMPRE se ejecuta: es el invariante del gate. ------
  # Este nombre de job es el contexto que ve GitHub, así que no se renombra sin romper
  # cualquier selección de check obligatorio.
  backend-tests:
    needs: [backend-tests-detect, backend-tests-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Consolidar el resultado del gate
        env:
          DETECT_RESULT: ${{ needs.backend-tests-detect.result }}
          SUITE_RESULT: ${{ needs.backend-tests-suite.result }}
          BACKEND: ${{ needs.backend-tests-detect.outputs.backend }}
          REASON: ${{ needs.backend-tests-detect.outputs.reason }}
          SUITE_SECONDS: ${{ needs.backend-tests-suite.outputs.pytest_seconds }}
          BUDGET: ${{ env.BACKEND_SUITE_BUDGET_SECONDS }}
          CEILING: ${{ env.BACKEND_SUITE_CEILING_SECONDS }}
        # Los casos se enumeran uno a uno en vez de escribir un `!= 'failure'`
        # abreviado: esa forma daría verde ante una cancelación y ante un job de
        # detección roto, que son precisamente los dos falsos verdes que hay que
        # evitar. Mismo criterio que la consolidación de frontend-tests.yml.
        run: |
          set -euo pipefail

          if [ "$DETECT_RESULT" != "success" ]; then
            verdict=fail
            detail="el job de detección terminó en '${DETECT_RESULT}', así que no se sabe si la suite hacía falta"
            suite_line="no ejecutada"
          elif [ "$SUITE_RESULT" = "success" ]; then
            verdict=pass
            detail="la suite se ejecutó completa y pasó"
            suite_line="ejecutada y verde"
          elif [ "$SUITE_RESULT" = "skipped" ]; then
            if [ "$BACKEND" = "false" ]; then
              verdict=pass
              detail="el diff no toca \`backend/**\` ni este workflow, así que la suite NO se ejecutó"
              suite_line="**OMITIDA** (no ejecutada)"
            else
              # No debería poder ocurrir: si hacía falta, no se salta. Si pasa, es un
              # bug del gate y no un PR válido.
              verdict=fail
              detail="incoherencia del gate: la suite se saltó con backend='${BACKEND}'"
              suite_line="omitida indebidamente"
            fi
          else
            verdict=fail
            detail="la suite terminó en '${SUITE_RESULT}'"
            suite_line="${SUITE_RESULT}"
          fi

          # --- Presupuesto de tiempo (R4.2, R4.3, D7) -------------------------------
          #
          # El resumen nombra SIEMPRE las dos cifras declaradas, se haya ejecutado la
          # suite o no: un aviso o un rojo tienen que poder juzgarse sin abrir el log.
          #
          # Tres situaciones y no dos. Que la suite se saltara por el camino corto no
          # deja laguna: no hay duración porque no hubo nada que medir. Que se ejecutara
          # y la duración NO llegue sí es una laguna, y R4.3 prohíbe resolverla en verde.
          #
          # Y los valores se validan como enteros ANTES de compararlos, porque las
          # comparaciones de abajo van en posición de test de un `if` — y esa posición está
          # **exenta** de `set -e`. Con un valor no numérico, `[ … -gt … ]` no compara: da
          # error y bash lee el error como «falso», es decir, como «no pasa del techo». Una
          # cifra corrupta se convertiría así en un verde silencioso, que es exactamente lo
          # que R4.3 prohíbe. Encontrado por el panel de QA de esta sección, probándolo.
          # Valida forma **y** rango. Solo la forma no basta: una ristra de 30 dígitos pasa
          # el filtro de caracteres y luego desborda la aritmética de `[ … -gt … ]`, que
          # vuelve a fallar en posición de test y vuelve a leerse como «falso» — la misma
          # laguna, un paso más adentro. Nueve dígitos son 31 años de suite: de sobra.
          is_integer() {
            case "${1:-}" in
              '' | *[!0-9]*) return 1 ;;
            esac
            [ "${#1}" -le 9 ]
          }

          over_budget=""
          if ! is_integer "${BUDGET:-}" || ! is_integer "${CEILING:-}"; then
            # Las dos cifras son literales de este mismo fichero, así que esto solo puede
            # pasar si alguien las rompe al editarlas. Se cae a la cara: un gate que no
            # sabe contra qué compara no puede dar verde.
            verdict=fail
            detail="las cifras declaradas del presupuesto no son enteros (presupuesto='${BUDGET:-}', techo='${CEILING:-}'), así que no hay contra qué comparar"
            duration_line="sin comparar"
          elif [ "$SUITE_RESULT" = "skipped" ]; then
            duration_line="no aplica — la suite no se ejecutó"
          elif ! is_integer "${SUITE_SECONDS:-}"; then
            duration_line="**no llegó**"
            if [ "$verdict" = "pass" ]; then
              verdict=fail
              detail="la suite se ejecutó pero su duración no llegó hasta aquí en forma de entero (recibido: '${SUITE_SECONDS:-}'), así que el presupuesto no se ha podido comprobar"
            fi
          else
            duration_line="**${SUITE_SECONDS}s**"
            if [ "$SUITE_SECONDS" -gt "$CEILING" ]; then
              verdict=fail
              detail="la suite tardó ${SUITE_SECONDS}s y el techo declarado son ${CEILING}s"
            elif [ "$SUITE_SECONDS" -gt "$BUDGET" ]; then
              over_budget=1
            fi
          fi

          {
            echo "## backend-tests"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Veredicto | ${verdict} |"
            echo "| Suite del backend | ${suite_line} |"
            echo "| Decisión de área | \`${BACKEND:-desconocida}\` (\`${REASON:-sin razón}\`) |"
            echo "| Duración de \`pytest\` | ${duration_line} |"
            echo "| Presupuesto · techo | ${BUDGET}s · ${CEILING}s |"
            echo ""
            echo "${detail}"
            if [ -n "$over_budget" ]; then
              echo ""
              echo "> ⚠️ **La suite pasó del presupuesto**: ${SUITE_SECONDS}s frente a los ${BUDGET}s"
              echo "> declarados. No bloquea el merge —para eso está el techo de ${CEILING}s—, pero es"
              echo "> la señal de que el coste está volviendo a subir. Se mide, no se redondea."
            fi
            if [ "$duration_line" = "**no llegó**" ]; then
              echo ""
              echo "> La suite se ejecutó pero no publicó su duración, así que **el presupuesto no se"
              echo "> ha comprobado**. Esto no se degrada a verde: sin la cifra, el check no sabe si"
              echo "> hubo regresión."
            fi
            if [ "$suite_line" = "**OMITIDA** (no ejecutada)" ]; then
              echo ""
              echo "> Este check está verde porque **no había nada que verificar**, no porque"
              echo "> la suite haya pasado. Un PR que toque \`backend/**\` la ejecuta entera."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict" != "pass" ]; then
            echo "::error::${detail}"
            exit 1
          fi
          if [ -n "$over_budget" ]; then
            echo "::warning::la suite tardó ${SUITE_SECONDS}s y el presupuesto son ${BUDGET}s"
          fi
          echo "::notice::${detail}"
