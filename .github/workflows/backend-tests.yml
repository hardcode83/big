name: backend-tests

# Merge gate reproducible para el backend, pedido en la revisión del PR #25: hasta
# ahora la suite solo existía en la máquina de quien la ejecutaba, así que "1166
# verdes" no era evidencia que nadie más pudiera reproducir. Ejecuta lo mismo que
# `sdd/project.md` manda ejecutar en local, en un entorno limpio:
#
#   1. migraciones Alembic sobre un PostgreSQL recién creado (no `create_all`, que es
#      lo que usa la suite y por tanto no probaría la cadena real de migraciones);
#   2. `alembic check`, que falla si los modelos y el esquema han divergido;
#   3. la suite completa, que incluye los tests de auth, rotación, revocación, RBAC y
#      aislamiento por tenant.
#
# SIN filtro `paths` a propósito: un required check con filtro de rutas no se ejecuta
# en los PR que no tocan esas rutas, y GitHub deja el PR bloqueado esperando para
# siempre un check que nunca llegará. La suite tarda ~1 minuto; no merece el riesgo.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres Y Redis. Redis no es opcional: tests/auth/test_throttle.py prueba el
    # adaptador de Redis a propósito SIN skip (es la única implementación de
    # producción de R5.1-R5.4), así que sin este servicio esos tests van a rojo en vez
    # de desaparecer en el contador de skips.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autohostai
          POSTGRES_USER: autohostai
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autohostai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://autohostai:ci-local-only@localhost:5432/autohostai
      REDIS_URL: redis://localhost:6379/0
      # El nombre de la base de datos por-run de la suite (tests/db_names.py) sale del
      # pid; fijarlo aquí lo hace legible en los logs y reproducible al reintentar.
      PYTEST_DB_SUFFIX: ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `make version-check` parsea el TOML y el JSON con `tomllib`/`json` (stdlib >=3.11),
      # así que necesita un intérprete con versión garantizada. Pinear la versión aquí, en
      # vez de confiar en el `python3` que traiga la imagen del runner, es lo que exige el
      # criterio de reproducibilidad de `specs/backend-ci.md` — mismo motivo por el que las
      # actions van por SHA. Sin esto, un cambio en la imagen base de `ubuntu-latest`
      # rompería el gate en cada PR con `ModuleNotFoundError: tomllib` (panel de CI/CD).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Baratas y primero: si algo de esto falla, no merece la pena montar Postgres.
      # Viven aquí porque es el único gate que corre en CADA PR sin filtro de `paths`
      # (change app-version-visibility, R6.2). Sin `working-directory`: necesitan la raíz.
      #   version-check     → VERSION vs los dos manifiestos
      #   pr-extract-check  → la extracción del PR del subject del commit no ha regresado
      - name: Comprobaciones de repo (paridad de versión y extracción de PR)
        run: make ci-checks

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Generar una clave JWT de usar y tirar
        # Generada en cada ejecución en vez de escrita en el repo o guardada como
        # secret: `settings` exige >=32 caracteres al importar (R1.7), pero esta clave
        # no firma nada que salga del job. Mismo criterio que `make up` en local, y así
        # no hay ningún valor con pinta de secreto versionado (steering/security.md #8).
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        working-directory: backend
        run: uv sync --frozen

      - name: Migraciones sobre PostgreSQL limpio
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Los modelos coinciden con el esquema migrado
        working-directory: backend
        run: uv run alembic check

      - name: Suite completa (incluye auth, RBAC y aislamiento por tenant)
        working-directory: backend
        run: uv run pytest -q -rs

      - name: Las migraciones se pueden deshacer hasta la base
        working-directory: backend
        # `downgrade base` no lo cubre la suite (test_migrations.py desanda revisión a
        # revisión hasta la anterior a este change, no hasta cero) y es lo que un
        # operador ejecuta cuando un deploy sale mal.
        run: uv run alembic downgrade base
