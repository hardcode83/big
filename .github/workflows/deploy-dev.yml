name: deploy-dev

# CD del entorno dev: construye las imágenes `prod` arm64 de backend/frontend, las publica
# en GHCR (tag por SHA + `dev`), y las despliega en la VM vía un runner self-hosted que corre
# EN la propia VM (deploy local, sin SSH ni puertos entrantes — el security list del hardening
# queda intacto). Disparo: push a `main` (path-filtered) o manual. [R1, R3, R4, R5]

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.deploy.yml"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch: {}

jobs:
  # --- Build & push a GHCR (runners GitHub-hosted, salida a GHCR) [R1] ---
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend (prod, arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/devops/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/autohostai-backend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/autohostai-backend:dev

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push frontend (prod, arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/devops/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          # NEXT_PUBLIC_* se hornean en build (Next standalone) → build-args, no runtime. [R1]
          build-args: |
            NEXT_PUBLIC_APP_ENV=${{ secrets.NEXT_PUBLIC_APP_ENV }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/autohostai-frontend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/autohostai-frontend:dev

  # --- Deploy LOCAL en la VM (runner self-hosted); sin SSH ni puertos entrantes [R3, R4, R5] ---
  deploy:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dev]
    timeout-minutes: 15
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render .env desde Secrets (validación previa) [R4]
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          BACKEND_INTERNAL_URL: ${{ secrets.BACKEND_INTERNAL_URL }}
        run: |
          set -euo pipefail
          missing=()
          for k in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD JWT_SECRET_KEY ENCRYPTION_KEY; do
            [ -n "${!k:-}" ] || missing+=("$k")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::faltan secrets requeridos para el runtime: ${missing[*]}"
            exit 1
          fi
          umask 077
          {
            echo "IMAGE_TAG=sha-${GITHUB_SHA}"
            echo "GHCR_NS=${GITHUB_REPOSITORY_OWNER}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}"
            echo "ENCRYPTION_KEY=${ENCRYPTION_KEY}"
            [ -n "${BACKEND_INTERNAL_URL:-}" ] && echo "BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}" || true
          } > .env
          chmod 600 .env

      - name: Login GHCR (read-only) [R3]
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${GITHUB_REPOSITORY_OWNER}" --password-stdin

      - name: Deploy — pull + up --wait [R3, R5]
        run: |
          set -euo pipefail
          docker compose -f docker-compose.deploy.yml pull
          if ! docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 180; then
            echo "::error::deploy falló — servicios no healthy dentro del timeout"
            docker compose -f docker-compose.deploy.yml logs --tail=200
            exit 1
          fi

      - name: Logout GHCR
        if: always()
        run: docker logout ghcr.io || true
