name: deploy-dev

# CD del entorno dev: construye las imágenes `prod` arm64 de backend/frontend, las publica
# en GHCR (tag por SHA + `dev`), y las despliega en la VM vía un runner self-hosted que corre
# EN la propia VM (deploy local, sin SSH ni puertos entrantes — el security list del hardening
# queda intacto). Disparo: push a `main` (path-filtered) o manual. [R1, R3, R4, R5]

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.deploy.yml"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch: {}

jobs:
  # --- Identidad de build, calculada UNA vez para las dos imágenes [R1.1, R1.5] ---
  # Un job propio, no un step en cada build: R1.5 exige que las dos imágenes lleven
  # idéntica cadena, y calcularlo dos veces es exactamente cómo se desincronizan (D2).
  provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compose.outputs.version }}
      commit_short: ${{ steps.compose.outputs.commit_short }}
      built_at: ${{ steps.compose.outputs.built_at }}
      repo_url: ${{ steps.compose.outputs.repo_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Componer la identidad de build
        id: compose
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "::error::no existe el fichero VERSION en la raíz del repo" >&2; exit 1
          fi
          base="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$base" ]; then echo "::error::VERSION está vacío" >&2; exit 1; fi
          if ! printf '%s' "$base" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION no tiene forma X.Y.Z (leído: '$base')" >&2; exit 1
          fi
          # UNA sola lectura del reloj: con dos invocaciones de `date`, un build que
          # cruzase la medianoche UTC dejaría la fecha de la versión un día por delante
          # del label `.created`.
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=${base}+${built_at%%T*}.${GITHUB_SHA:0:7}"
            echo "commit_short=${GITHUB_SHA:0:7}"
            echo "built_at=${built_at}"
            echo "repo_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          } >> "$GITHUB_OUTPUT"

  # --- Build & push a GHCR (runners GitHub-hosted, salida a GHCR) [R1] ---
  build-backend:
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend (prod, arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/devops/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          # Labels OCI (R1.5): la identidad de la imagen legible con `docker inspect` en la
          # VM y en la página del package de GHCR, sin variables de runtime.
          labels: |
            org.opencontainers.image.source=${{ needs.provenance.outputs.repo_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.provenance.outputs.version }}
            org.opencontainers.image.created=${{ needs.provenance.outputs.built_at }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/autohostai-backend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/autohostai-backend:dev

  build-frontend:
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push frontend (prod, arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/devops/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          # NEXT_PUBLIC_* se hornean en build (Next standalone) → build-args, no runtime. [R1]
          #
          # Solo las dos que pinta el badge. Son públicas por decisión: el snapshot de
          # `PublicRuntimeConfig` cruza al navegador en todas las superficies.
          build-args: |
            NEXT_PUBLIC_APP_ENV=${{ vars.NEXT_PUBLIC_APP_ENV }}
            NEXT_PUBLIC_APP_VERSION=${{ needs.provenance.outputs.version }}
            NEXT_PUBLIC_BUILD_COMMIT_SHORT=${{ needs.provenance.outputs.commit_short }}
          labels: |
            org.opencontainers.image.source=${{ needs.provenance.outputs.repo_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.provenance.outputs.version }}
            org.opencontainers.image.created=${{ needs.provenance.outputs.built_at }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/autohostai-frontend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/autohostai-frontend:dev

  # --- Deploy LOCAL en la VM (runner self-hosted); sin SSH ni puertos entrantes [R3, R4, R5] ---
  deploy:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dev]
    permissions:
      contents: read # checkout
      packages: read # pull de las imágenes privadas de GHCR con el GITHUB_TOKEN del job
    timeout-minutes: 15
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render .env leyendo los secrets del OCI Vault (validación previa) [R4]
        env:
          # OCID del Vault: lo necesita la resolución POR NOMBRE del token del túnel. No puede salir
          # de /etc/autohostai-deploy.env porque ese fichero lo escribe cloud-init y `metadata` es
          # ForceNew con ignore_changes, así que Terraform no puede reescribirlo en la VM viva; una
          # clave nueva ahí no llegaría nunca (change ingress-https-dev, design D3).
          OCI_VAULT_ID: ${{ vars.OCI_VAULT_ID }}
        run: |
          set -euo pipefail
          source /etc/autohostai-deploy.env   # OCIDs de los secrets + POSTGRES_DB/USER (sin secretos)
          read_secret() { # $1 = OCID; imprime el valor o falla nombrando la clave ($2)
            local val
            val="$(oci --auth instance_principal secrets secret-bundle get \
              --secret-id "$1" --query 'data."secret-bundle-content".content' --raw-output 2>/dev/null | base64 -d)" || true
            if [ -z "$val" ]; then echo "::error::no se pudo leer del Vault el secret requerido: $2" >&2; exit 1; fi
            printf '%s' "$val"
          }
          read_secret_by_name() { # $1 = nombre del secret en el Vault; $2 = clave para el mensaje
            local val
            if [ -z "${OCI_VAULT_ID:-}" ]; then
              echo "::error::falta la variable de repo OCI_VAULT_ID, necesaria para resolver $2 por nombre" >&2; exit 1
            fi
            val="$(oci --auth instance_principal secrets secret-bundle get-secret-bundle-by-name \
              --secret-name "$1" --vault-id "$OCI_VAULT_ID" \
              --query 'data."secret-bundle-content".content' --raw-output 2>/dev/null | base64 -d)" || true
            if [ -z "$val" ]; then echo "::error::no se pudo leer del Vault el secret requerido: $2 (nombre: $1)" >&2; exit 1; fi
            printf '%s' "$val"
          }
          PG_PASSWORD="$(read_secret "$PG_PASSWORD_SECRET_OCID" POSTGRES_PASSWORD)"
          JWT_KEY="$(read_secret "$JWT_SECRET_OCID" JWT_SECRET_KEY)"
          ENC_KEY="$(read_secret "$ENCRYPTION_KEY_SECRET_OCID" ENCRYPTION_KEY)"
          # El nombre es determinista (lo fija Terraform como autohostai-<env>-...), así que se
          # deriva de ENV en vez de necesitar otra variable de repo.
          TUNNEL_TOKEN="$(read_secret_by_name "autohostai-${ENV}-cloudflare-tunnel-token" TUNNEL_TOKEN)"
          umask 077
          {
            echo "IMAGE_TAG=sha-${GITHUB_SHA}"
            echo "GHCR_NS=${GITHUB_REPOSITORY_OWNER}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${PG_PASSWORD}"
            echo "JWT_SECRET_KEY=${JWT_KEY}"
            echo "ENCRYPTION_KEY=${ENC_KEY}"
            echo "BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}"
            echo "TUNNEL_TOKEN=${TUNNEL_TOKEN}"
          } > .env
          chmod 600 .env

      - name: Login GHCR (GITHUB_TOKEN del job, read-only) [R3]
        # El job corre en un workflow del repo → su GITHUB_TOKEN (packages: read) está cubierto por
        # el "Manage Actions access" del package (repo AutoHostAI). Un token de GitHub App NO lo está
        # (no es "Actions del repo" ni miembro), por eso el pull daba 403. La App solo registra el
        # runner (bootstrap), no hace pull de GHCR.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy — pull + up --wait [R3, R5]
        run: |
          set -euo pipefail
          docker compose -f docker-compose.deploy.yml pull
          if ! docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 180; then
            echo "::error::deploy falló — servicios no healthy dentro del timeout"
            docker compose -f docker-compose.deploy.yml logs --tail=200
            exit 1
          fi

      # `up -d --wait` NO detecta que el túnel haya perdido el origen: el healthcheck de
      # `cloudflared` es `tunnel ready`, que solo comprueba la conexión con el EDGE, y el del
      # frontend corre dentro de su propio contenedor contra 127.0.0.1:3000. Así que si alguien deja
      # `frontend` fuera de la red `ingress`, el deploy pasaría en verde y la URL pública serviría
      # 502 hasta que alguien lo notara. Esta sonda cierra ese hueco: corre DENTRO de `ingress`, que
      # es la red desde la que `cloudflared` tiene que alcanzar el origen, y usa la imagen del
      # frontend que el `pull` de arriba ya ha bajado, con la misma técnica que su healthcheck.
      # [R1.6]
      - name: Verificar que el origen es alcanzable desde la red de ingress [R1.6]
        # Cota de la propia sonda: sin ella un origen que acepta la conexión TCP pero no responde
        # dejaría el paso colgado hasta el `timeout-minutes: 15` del job, y como el `concurrency`
        # de este job es `cancel-in-progress: false`, ningún deploy de arreglo podría arrancar
        # detrás. R1.6 pide fallar ANTES de dar el despliegue por bueno, no tardar 15 minutos.
        timeout-minutes: 2
        run: |
          set -euo pipefail
          CID="$(docker compose -f docker-compose.deploy.yml ps -q cloudflared)"
          if [ -z "${CID:-}" ]; then
            echo "::error::no hay contenedor de cloudflared en marcha: no se puede comprobar el origen"
            exit 1
          fi
          # Una red por línea y se exige exactamente una: el `range` sin separador concatenaría los
          # nombres y dejaría un $NET inservible, con un mensaje de error que apuntaría al sitio
          # equivocado justo cuando alguien esté depurando en caliente.
          NETS=()
          mapfile -t NETS < <(docker inspect \
            -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$CID" | sed '/^$/d')
          if [ "${#NETS[@]}" -ne 1 ]; then
            echo "::error::cloudflared está conectado a ${#NETS[@]} redes (${NETS[*]-ninguna}), se esperaba exactamente 1 — revisa la sección 'networks' de docker-compose.deploy.yml"
            exit 1
          fi
          NET="${NETS[0]}"
          echo "red de ingress detectada: $NET"
          PROBE=autohostai-ingress-probe
          # `trap EXIT` y no solo limpieza al final del script: si un comando de docker se cuelga por
          # causas ajenas a la sonda (dockerd cargado, contención de I/O — justo lo que pasa en un
          # incidente, que es cuando este paso importa), Actions mata el PROCESO DEL STEP al llegar a
          # `timeout-minutes` y las líneas de limpieza de abajo no se ejecutarían nunca; el contenedor,
          # lanzado con `-d` y gestionado por dockerd, sobreviviría pegado a la red `ingress`.
          #
          # La limpieza del trap va acotada, y el motivo es concreto: cuando el runner corta el step
          # manda SIGINT (que un bash no interactivo bloqueado en un comando externo IGNORA), espera
          # ~7,5 s, manda SIGTERM —esto sí dispara el trap— y solo concede ~2,5 s antes de hacer
          # SIGKILL de todo el árbol. Sin cota, un `docker kill` bloqueado contra el mismo daemon
          # colgado se comería esa ventana y el `docker rm -f` no llegaría a ejecutarse.
          #
          # `-k 0.2 0.8` y no `timeout 0.8` a secas: `timeout` SIN `--kill-after` solo MANDA TERM al
          # vencer el plazo, no fuerza nada. Medido: un proceso que ignora TERM sobrevive al
          # `timeout 1` y corre hasta el final (30 s en la prueba); con `-k 0.2` muere a ~1,2 s por
          # SIGKILL. Así el peor caso de las dos llamadas es 2 × 1,0 s = 2,0 s, dentro de la ventana.
          #
          # GARANTÍA REAL, y no es incondicional: limpia salvo que dockerd esté sin responder dentro
          # de esa ventana; en ese caso el job falla igual, pero el contenedor puede quedar hasta que
          # lo barra el `docker rm -f` previo del siguiente deploy.
          trap 'timeout -k 0.2 0.8 docker kill "$PROBE" >/dev/null 2>&1 || true; timeout -k 0.2 0.8 docker rm -f "$PROBE" >/dev/null 2>&1 || true' EXIT
          docker rm -f "$PROBE" >/dev/null 2>&1 || true
          # Se lanza en SEGUNDO PLANO y el corte se aplica con `docker kill` POR NOMBRE contra el
          # daemon. `timeout` envolviendo un `docker run` en primer plano no sirve para esto: solo
          # señala al cliente de la CLI, y matar el cliente NO para el contenedor —lo gestiona
          # dockerd—, así que un proceso encallado (bucle síncrono, GC, host sin CPU) se quedaría
          # pegado a la red `ingress`, que es precisamente la frontera que este change protege.
          docker run -d --name "$PROBE" --network "$NET" --entrypoint node \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/autohostai-frontend:sha-${GITHUB_SHA}" \
            -e "const r=require('http').get('http://frontend:3000',s=>process.exit(s.statusCode<500?0:1)); r.setTimeout(10000,()=>{console.error('timeout esperando a frontend:3000');r.destroy();process.exit(1)}); r.on('error',e=>{console.error(String(e));process.exit(1)})" >/dev/null
          CODE=""
          for _ in $(seq 1 20); do
            STATE="$(docker inspect -f '{{.State.Status}}' "$PROBE" 2>/dev/null || echo ausente)"
            # Comprobación POSITIVA del estado terminal, no `!= running`: con `!=` cualquier estado
            # transitorio o desconocido (`created`, …) se leería como terminado y `ExitCode` vale 0
            # por defecto, es decir verde sin que el `http.get` haya empezado. Cualquier otro estado
            # se trata como "seguir esperando", que es el lado seguro.
            case "$STATE" in
              exited|dead)
                CODE="$(docker inspect -f '{{.State.ExitCode}}' "$PROBE" 2>/dev/null || echo 1)"
                break
                ;;
              ausente)
                echo "::error::el contenedor de la sonda desapareció antes de poder leer su salida"
                exit 1
                ;;
            esac
            sleep 1
          done
          docker logs "$PROBE" 2>&1 | tail -20 || true
          if [ -z "$CODE" ]; then
            echo "::error::la sonda de origen no terminó en 20s; se mata para no dejarla pegada a la red de ingress"
            docker kill "$PROBE" >/dev/null 2>&1 || true
            docker rm -f "$PROBE" >/dev/null 2>&1 || true
            exit 1
          fi
          docker rm -f "$PROBE" >/dev/null 2>&1 || true
          if [ "$CODE" != "0" ]; then
            echo "::error::el origen no es alcanzable desde la red de ingress ($NET) — el túnel serviría 502. ¿Está 'frontend' en esa red?"
            docker compose -f docker-compose.deploy.yml logs --tail=100 frontend cloudflared
            exit 1
          fi

      - name: Logout GHCR
        if: always()
        run: docker logout ghcr.io || true
