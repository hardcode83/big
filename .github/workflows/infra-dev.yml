name: infra-dev

on:
  pull_request:
    paths:
      - "infra/environments/dev/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar contra el entorno dev real"
        required: true
        type: choice
        options:
          - plan
          - apply
      ad_number:
        description: "Availability Domain (1-based) de la instancia. La instancia dev vive en AD-3 (donde se encontró capacidad al bootstrap). NO lo cambies para operar la máquina existente: mover de AD = destruir + recrear (vuelta a la ruleta de capacidad). Solo súbelo para un bootstrap nuevo si AD-3 diera 'Out of host capacity'."
        required: false
        default: "3"
        type: string

defaults:
  run:
    working-directory: infra/environments/dev

jobs:
  # PR que toca infra/environments/dev/**: sin credenciales de OCI (init -backend=false). [R3.3]
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
      - name: terraform fmt
        run: terraform fmt -check -diff
      - name: terraform init (sin backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate

  # workflow_dispatch: plan (siempre) → sube el tfplan como artifact.
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
      - name: Escribir la private key a fichero
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: printf '%s\n' "$OCI_PRIVATE_KEY" > "$RUNNER_TEMP/oci_private_key.pem"
      - name: Escribir configuración del backend
        env:
          TFSTATE_BUCKET: ${{ secrets.TFSTATE_BUCKET }}
          TFSTATE_NAMESPACE: ${{ secrets.TFSTATE_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          PRIVATE_KEY_PATH: ${{ runner.temp }}/oci_private_key.pem
        run: |
          cat > backend.hcl <<EOF
          bucket           = "${TFSTATE_BUCKET}"
          namespace        = "${TFSTATE_NAMESPACE}"
          key              = "dev.tfstate"
          region           = "${OCI_REGION}"
          tenancy_ocid     = "${OCI_TENANCY_OCID}"
          user_ocid        = "${OCI_USER_OCID}"
          fingerprint      = "${OCI_FINGERPRINT}"
          private_key_path = "${PRIVATE_KEY_PATH}"
          EOF
      - name: terraform init
        run: terraform init -input=false -backend-config=backend.hcl
      - name: terraform validate
        run: terraform validate
      - name: terraform plan
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci_private_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          # Vars-lista: se envuelven en JSON desde secrets de un solo valor (un operador).
          # Para varios operadores, convertir el secret en un array JSON y pasarlo tal cual.
          TF_VAR_allowed_ssh_cidrs: '["${{ secrets.ALLOWED_SSH_CIDR }}"]'
          TF_VAR_ssh_authorized_keys: '["${{ secrets.SSH_PUBLIC_KEY }}"]'
          TF_VAR_ad_number: ${{ github.event.inputs.ad_number }}
          # OCID del secret del Vault con el PAT de GitHub (runner self-hosted, change app-deploy-dev).
          # Es un identificador, no el secreto; github_repo usa su default.
          TF_VAR_runner_pat_secret_ocid: ${{ secrets.RUNNER_PAT_SECRET_OCID }}
          # budget_alert_recipients usa su default (Jose + Marta).
        run: terraform plan -input=false -out=tfplan
      - name: Subir el plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan
          path: infra/environments/dev/tfplan
          retention-days: 1

  # apply: solo desde main y solo si action=apply. En repo privado + plan Free NO hay Environment
  # con required reviewers, así que el gate de aprobación es (opción A): el código llega a main
  # revisado vía PR + el dispatch de apply es manual y solo desde main → solo se aplica lo revisado.
  # concurrency serializa applies sobre el mismo state. [R1]
  apply:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: infra-dev-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
      - name: Escribir la private key a fichero
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: printf '%s\n' "$OCI_PRIVATE_KEY" > "$RUNNER_TEMP/oci_private_key.pem"
      - name: Escribir configuración del backend
        env:
          TFSTATE_BUCKET: ${{ secrets.TFSTATE_BUCKET }}
          TFSTATE_NAMESPACE: ${{ secrets.TFSTATE_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          PRIVATE_KEY_PATH: ${{ runner.temp }}/oci_private_key.pem
        run: |
          cat > backend.hcl <<EOF
          bucket           = "${TFSTATE_BUCKET}"
          namespace        = "${TFSTATE_NAMESPACE}"
          key              = "dev.tfstate"
          region           = "${OCI_REGION}"
          tenancy_ocid     = "${OCI_TENANCY_OCID}"
          user_ocid        = "${OCI_USER_OCID}"
          fingerprint      = "${OCI_FINGERPRINT}"
          private_key_path = "${PRIVATE_KEY_PATH}"
          EOF
      - name: terraform init
        run: terraform init -input=false -backend-config=backend.hcl
      - name: Descargar el plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan
          path: infra/environments/dev
      # La config del provider se re-evalúa en apply (no viaja en el tfplan) → necesita las vars de identidad.
      - name: terraform apply
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci_private_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
        run: terraform apply -input=false -auto-approve tfplan
