name: infra-dev

on:
  pull_request:
    paths:
      - "infra/environments/dev/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar contra el entorno dev real"
        required: true
        type: choice
        options:
          - plan
          - apply

defaults:
  run:
    working-directory: infra/environments/dev

jobs:
  # Se ejecuta en cualquier PR que toque infra/environments/dev/**, sin credenciales de
  # OCI — terraform init -backend=false salta por completo el backend remoto. [R3.3]
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: terraform fmt
        run: terraform fmt -check -diff

      - name: terraform init (sin backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  # Único disparador que puede tocar recursos reales — nunca automático en push/merge. [R3.1, R3.2]
  plan-apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Config parcial del backend oci — sus propias credenciales, no puede leer var.*
      # (los backends se configuran antes de que existan variables de Terraform).
      - name: Escribir configuración del backend
        env:
          TFSTATE_BUCKET: ${{ secrets.TFSTATE_BUCKET }}
          TFSTATE_NAMESPACE: ${{ secrets.TFSTATE_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${TFSTATE_BUCKET}"
          namespace    = "${TFSTATE_NAMESPACE}"
          key          = "dev.tfstate"
          region       = "${OCI_REGION}"
          tenancy_ocid = "${OCI_TENANCY_OCID}"
          user_ocid    = "${OCI_USER_OCID}"
          fingerprint  = "${OCI_FINGERPRINT}"
          private_key  = <<PRIVATEKEY
          ${OCI_PRIVATE_KEY}
          PRIVATEKEY
          EOF

      - name: terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: terraform plan
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_allowed_ssh_cidr: ${{ secrets.ALLOWED_SSH_CIDR }}
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        if: ${{ github.event.inputs.action == 'apply' }}
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_allowed_ssh_cidr: ${{ secrets.ALLOWED_SSH_CIDR }}
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: terraform apply -input=false -auto-approve tfplan
