# Runner self-hosted en la VM dev (label `[self-hosted, dev]`). Rollback: ver
# docs/ci-runner-rollback.md (procedimiento + SHA del commit de migración).
# Cambio: ci-runner-oci (PR <n>).
name: infra-dev

on:
  pull_request:
    paths:
      - "infra/environments/dev/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar contra el entorno dev real"
        required: true
        type: choice
        options:
          - plan
          - apply
      ad_number:
        description: "Availability Domain (1-based) de la instancia. La instancia dev vive en AD-3 (donde se encontró capacidad al bootstrap). NO lo cambies para operar la máquina existente: mover de AD = destruir + recrear (vuelta a la ruleta de capacidad). Solo súbelo para un bootstrap nuevo si AD-3 diera 'Out of host capacity'."
        required: false
        default: "3"
        type: string

defaults:
  run:
    working-directory: infra/environments/dev

jobs:
  # PR que toca infra/environments/dev/**: sin credenciales de OCI (init -backend=false). [R3.3]
  check:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, dev]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
      - name: terraform fmt
        run: terraform fmt -check -diff
      - name: terraform init (sin backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate

  # workflow_dispatch: plan (siempre) para revisión por logs — NO usa -out ni sube artifact
  # (el plan contendría secrets desde app-deploy-dev); el apply re-planifica en su propio job.
  plan:
    # Acotado a `main` igual que `apply`. Desde el change ingress-https-dev este job recibe
    # CLOUDFLARE_API_TOKEN, que tiene control de DNS y de los ajustes de TLS de TODA la zona
    # digitalsec.work (no solo de dev). Un workflow_dispatch sobre una rama arbitraria ejecuta la
    # definición del workflow de ESA rama con el secret en su env, y `sensitive = true` no impide
    # desredactarlo desde código no revisado (nonsensitive(), provider http, troceado del valor).
    # Consecuencia operativa aceptada: no se puede planificar desde una rama de feature; el plan de
    # un change se ejecuta tras mergear a `main` (ver BLOCKED.md #2).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dev]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
      - name: Escribir la private key a fichero
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        # umask 077 antes del printf: en el runner self-hosted persistente el fichero convive con
        # otros procesos/usuarios locales, a diferencia del runner GH-hosted efímero de antes de
        # ci-runner-oci (hallazgo del panel de seguridad — riesgo aceptado documentado en design.md).
        run: |
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$RUNNER_TEMP/oci_private_key.pem"
      - name: Escribir configuración del backend
        env:
          TFSTATE_BUCKET: ${{ secrets.TFSTATE_BUCKET }}
          TFSTATE_NAMESPACE: ${{ secrets.TFSTATE_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          PRIVATE_KEY_PATH: ${{ runner.temp }}/oci_private_key.pem
        # umask 077 por consistencia con el paso anterior (panel de seguridad, segunda pasada):
        # bucket/namespace/región/OCIDs/fingerprint no autentican por sí solos, pero no hay razón
        # para dejar el fichero en el modo por defecto del runner persistente.
        run: |
          umask 077
          cat > backend.hcl <<EOF
          bucket           = "${TFSTATE_BUCKET}"
          namespace        = "${TFSTATE_NAMESPACE}"
          key              = "dev.tfstate"
          region           = "${OCI_REGION}"
          tenancy_ocid     = "${OCI_TENANCY_OCID}"
          user_ocid        = "${OCI_USER_OCID}"
          fingerprint      = "${OCI_FINGERPRINT}"
          private_key_path = "${PRIVATE_KEY_PATH}"
          EOF
      - name: terraform init
        run: terraform init -input=false -backend-config=backend.hcl
      - name: terraform validate
        run: terraform validate
      - name: terraform plan
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci_private_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          # Vars-lista, con DOS formas admitidas y en este orden de preferencia:
          #   1. `*_CIDRS`/`*_KEYS`: un array JSON ya escrito, p. ej. ["1.2.3.4/32","5.6.7.8/32"].
          #      Es la única forma que admite VARIOS operadores.
          #   2. `*_CIDR`/`*_KEY` (singular, histórico): un valor suelto que se envuelve en lista.
          # Se conservan las dos a propósito: cambiar de la una a la otra habría dejado una ventana
          # en la que el apply falla —el secret plural aún no existe y el singular ya no se lee—,
          # y el fallo sería un JSON inválido en un `TF_VAR`, que no dice nada de lo que pasa.
          # El `||` de Actions cae al singular mientras el plural esté vacío o sin crear.
          #
          # Que el singular exista es lo que llevó a añadir operadores A MANO en la consola, donde
          # el siguiente apply los borraba sin avisar: `terraform plan` lo destapó el 2026-08-15 con
          # dos reglas de SSH que nadie había escrito en código.
          TF_VAR_allowed_ssh_cidrs: ${{ secrets.ALLOWED_SSH_CIDRS || format('["{0}"]', secrets.ALLOWED_SSH_CIDR) }}
          # Excepción nombrada al mínimo de /24 (ver `variables.tf`). Vacía si el secret no existe:
          # abrir un rango ancho tiene que costar crear un secret aparte, no heredarse por defecto.
          TF_VAR_allowed_ssh_cidrs_wide: ${{ secrets.ALLOWED_SSH_CIDRS_WIDE || '[]' }}
          TF_VAR_ssh_authorized_keys: ${{ secrets.SSH_PUBLIC_KEYS || format('["{0}"]', secrets.SSH_PUBLIC_KEY) }}
          TF_VAR_ad_number: ${{ github.event.inputs.ad_number }}
          # GitHub App del runner self-hosted (change app-deploy-dev). ids no sensibles → vars;
          # la clave privada (sensible) → secret, y Terraform la escribe al Vault de cada entorno.
          TF_VAR_github_app_id: ${{ vars.GH_APP_ID }}
          TF_VAR_github_app_installation_id: ${{ vars.GH_APP_INSTALLATION_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Ingress HTTPS vía Cloudflare Tunnel (change ingress-https-dev). El hostname y el apex
          # son nombres DNS públicos → vars; el zone id y el API token → secrets.
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          TF_VAR_public_hostname: ${{ vars.PUBLIC_HOSTNAME }}
          # budget_alert_recipients usa su default (Jose + Marta).
        # NO se usa `-out=tfplan` ni se sube el plan como artifact: desde app-deploy-dev el plan
        # contiene secrets (clave de la App + secrets de runtime generados por TF), y un artifact
        # es descargable por cualquiera con read del repo — superficie mayor que la IAM del bucket
        # de state (hallazgo del panel de seguridad). El plan es para revisión por logs (Terraform
        # redacta los valores sensibles en consola). El apply re-planifica en el mismo job.
        run: terraform plan -input=false

  # apply: solo desde main y solo si action=apply. En repo privado + plan Free NO hay Environment
  # con required reviewers, así que el gate de aprobación es (opción A): el código llega a main
  # revisado vía PR + el dispatch de apply es manual y solo desde main → solo se aplica lo revisado.
  # concurrency serializa applies sobre el mismo state. [R1]
  apply:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: [self-hosted, dev]
    timeout-minutes: 15
    concurrency:
      group: infra-dev-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
      - name: Escribir la private key a fichero
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        # umask 077 antes del printf: en el runner self-hosted persistente el fichero convive con
        # otros procesos/usuarios locales, a diferencia del runner GH-hosted efímero de antes de
        # ci-runner-oci (hallazgo del panel de seguridad — riesgo aceptado documentado en design.md).
        run: |
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$RUNNER_TEMP/oci_private_key.pem"
      - name: Escribir configuración del backend
        env:
          TFSTATE_BUCKET: ${{ secrets.TFSTATE_BUCKET }}
          TFSTATE_NAMESPACE: ${{ secrets.TFSTATE_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          PRIVATE_KEY_PATH: ${{ runner.temp }}/oci_private_key.pem
        # umask 077 por consistencia con el paso anterior (panel de seguridad, segunda pasada):
        # bucket/namespace/región/OCIDs/fingerprint no autentican por sí solos, pero no hay razón
        # para dejar el fichero en el modo por defecto del runner persistente.
        run: |
          umask 077
          cat > backend.hcl <<EOF
          bucket           = "${TFSTATE_BUCKET}"
          namespace        = "${TFSTATE_NAMESPACE}"
          key              = "dev.tfstate"
          region           = "${OCI_REGION}"
          tenancy_ocid     = "${OCI_TENANCY_OCID}"
          user_ocid        = "${OCI_USER_OCID}"
          fingerprint      = "${OCI_FINGERPRINT}"
          private_key_path = "${PRIVATE_KEY_PATH}"
          EOF
      - name: terraform init
        run: terraform init -input=false -backend-config=backend.hcl
      # Sin plan pre-guardado (ver job `plan`): el apply re-planifica y aplica en el mismo job,
      # así ningún fichero con secrets sale del runner. Necesita TODAS las vars (no solo las de
      # identidad del provider), porque re-evalúa el plan completo.
      - name: terraform apply
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci_private_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          # Mismas dos formas que en el job `plan` — ver el comentario largo de allí.
          TF_VAR_allowed_ssh_cidrs: ${{ secrets.ALLOWED_SSH_CIDRS || format('["{0}"]', secrets.ALLOWED_SSH_CIDR) }}
          # Excepción nombrada al mínimo de /24 (ver `variables.tf`). Vacía si el secret no existe:
          # abrir un rango ancho tiene que costar crear un secret aparte, no heredarse por defecto.
          TF_VAR_allowed_ssh_cidrs_wide: ${{ secrets.ALLOWED_SSH_CIDRS_WIDE || '[]' }}
          TF_VAR_ssh_authorized_keys: ${{ secrets.SSH_PUBLIC_KEYS || format('["{0}"]', secrets.SSH_PUBLIC_KEY) }}
          TF_VAR_ad_number: ${{ github.event.inputs.ad_number }}
          TF_VAR_github_app_id: ${{ vars.GH_APP_ID }}
          TF_VAR_github_app_installation_id: ${{ vars.GH_APP_INSTALLATION_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Ingress HTTPS vía Cloudflare Tunnel (change ingress-https-dev). El hostname y el apex
          # son nombres DNS públicos → vars; el zone id y el API token → secrets.
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          TF_VAR_public_hostname: ${{ vars.PUBLIC_HOSTNAME }}
        run: terraform apply -input=false -auto-approve
