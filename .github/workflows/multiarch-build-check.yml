name: multiarch-build-check

# Verifica que backend/frontend construyen para linux/arm64 (instancia Ampere A1 del
# entorno dev, ADR 0001) además de linux/amd64 — en cada PR, sin credenciales, sin
# publicar a ningún registry. [R4.1, R4.2, R4.3]

on:
  pull_request:
    paths:
      - "backend/devops/Dockerfile"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/devops/Dockerfile"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/multiarch-build-check.yml"
  workflow_dispatch: {}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build backend (prod) — amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/devops/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: false

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend (prod) — amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/devops/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: false
