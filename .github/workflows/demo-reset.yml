# Runner self-hosted en la VM dev (label `[self-hosted, dev]`). Rollback: ver
# docs/ci-runner-rollback.md (procedimiento + SHA del commit de migración).
# Cambio: ci-runner-oci (PR <migration-pr>).
name: demo-reset

# Devuelve el tenant de demostración a su estado inicial, a diario y sobre el runner
# self-hosted que ya corre EN la VM (change `demo-user`, design D13/D14). [R5]
#
# Por qué el runner de la VM y no `ubuntu-latest`: el comando necesita la base de datos, y desde
# fuera eso exige publicar Postgres o abrir SSH. Aquí no se abre nada — cero puertos entrantes,
# cero SSH, el `security_list` intacto (R5.3) — porque el runner alcanza `postgres` por la red
# interna del compose. Un cron de máquina por cloud-init no es alternativa: el `metadata` de la
# instancia es `ForceNew` con `ignore_changes`, así que no llegaría nunca a la VM viva.

on:
  # 03:15 y no en punto: GitHub encola ahí los cron programados y la hora no es exacta. Y lejos
  # de las 06:00 UTC, cuando el beat corre `generate_price_recommendations`.
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch: {}

jobs:
  reset:
    # `schedule` sólo dispara desde la rama por defecto, pero `workflow_dispatch` no — y el gating
    # por rama de todo job que toca el entorno es la postura que `steering/infra.md` fija.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dev]
    permissions:
      contents: read # checkout
    timeout-minutes: 20
    # El MISMO grupo que el job `deploy` de `deploy-dev.yml`, y es el único acoplamiento que este
    # change añade al workflow existente: un reset no puede correr mientras un despliegue reescribe
    # el `.env` y recrea contenedores. `cancel-in-progress: false` porque las dos cosas tienen que
    # terminar, no adelantarse.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      # `clean: false` y no el checkout por defecto: el workspace del runner es el mismo directorio
      # para todos los workflows del repo, y el `.env` que renderiza el deploy NO está versionado.
      # El `git clean -ffdx` del checkout por defecto lo borraría, y con él la interpolación de
      # `docker-compose.deploy.yml`, que lleva `${GHCR_NS:?}`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false

      # Precondición explícita ANTES de invocar nada (R5.5). Sin esto, un entorno no desplegado
      # muere dentro de un error de interpolación de Compose, que no nombra ninguna fase.
      - name: Precondición — el entorno está desplegado
        run: |
          set -euo pipefail
          if [ ! -f .env ]; then
            echo "::error::precondición: el entorno no está desplegado (no hay .env en el workspace del runner). Lanza deploy-dev primero." >&2
            exit 1
          fi
          if ! docker compose -f docker-compose.deploy.yml ps --status running --quiet postgres | grep -q .; then
            echo "::error::precondición: el entorno no está desplegado (el servicio postgres no está corriendo)." >&2
            exit 1
          fi

      # Se lee del Vault por nombre determinista y se ENMASCARA de inmediato, antes de cualquier
      # otro paso (R5.4, R5.5): es el mecanismo por el que un fallo posterior no puede volcarla.
      #
      # `ENV` sale de /etc/autohostai-deploy.env, igual que en el deploy, así que el nombre del
      # secreto no necesita ninguna variable de repo nueva.
      - name: Leer del Vault la contraseña de demostración y enmascararla
        id: secret
        run: |
          set -euo pipefail
          source /etc/autohostai-deploy.env
          if [ -z "${OCI_VAULT_ID:-}" ]; then
            echo "::error::falta la variable de repo OCI_VAULT_ID, necesaria para resolver por nombre la contraseña de demostración" >&2
            exit 1
          fi
          name="autohostai-${ENV}-demo-account-password"
          val="$(oci --auth instance_principal secrets secret-bundle get-secret-bundle-by-name \
            --secret-name "$name" --vault-id "$OCI_VAULT_ID" \
            --query 'data."secret-bundle-content".content' --raw-output 2>/dev/null | base64 -d)" || true
          if [ -z "$val" ]; then
            echo "::error::no se pudo leer del Vault el secret requerido: DEMO_ACCOUNT_PASSWORD (nombre: $name)" >&2
            exit 1
          fi
          echo "::add-mask::$val"
          echo "DEMO_ACCOUNT_PASSWORD=$val" >> "$GITHUB_ENV"
        env:
          OCI_VAULT_ID: ${{ vars.OCI_VAULT_ID }}

      # `run --rm` y no `exec`: no depende de que el `backend` de larga vida esté *healthy*, y el
      # contenedor efímero muere con la contraseña dentro. `--no-deps` evita re-ejecutar `migrate`;
      # el servicio se une igualmente a la red `private`, que es por donde `postgres` es alcanzable.
      #
      # `-e DEMO_ACCOUNT_PASSWORD` **sin `=valor`**: pasa el valor desde el entorno del paso en vez
      # de escribirlo en la línea de órdenes, donde quedaría en la tabla de procesos de la VM.
      #
      # `-e BOOTSTRAP_STORAGE_TYPE=S3` porque el `.env` desplegado no la lleva, y sin ella el tenant
      # de demostración nacería `LOCAL` mientras `AutoHostAI Dev` es `S3` — la demo ejercitaría un
      # camino de almacenamiento que el entorno no usa.
      #
      # `python -m` y no `uv run`: `uv` sólo existe en la etapa de desarrollo del Dockerfile.
      - name: Resetear el tenant de demostración
        id: reset
        run: |
          set -euo pipefail
          docker compose -f docker-compose.deploy.yml run --rm --no-deps -T \
            -e DEMO_ACCOUNT_PASSWORD \
            -e BOOTSTRAP_STORAGE_TYPE=S3 \
            backend python -m app.cli.demo_reset | tee "$RUNNER_TEMP/demo-reset.out"

      # La URL del portal se publica y **no** se enmascara: el `::add-mask::` de arriba cubre la
      # contraseña y sólo la contraseña (D19, última nota). Es la excepción única y nombrada de
      # R2.5, y no publicarla es perderla — su valor en claro existe una sola vez.
      - name: Publicar el enlace del portal en el resumen del job
        if: always() && steps.reset.outcome == 'success'
        run: |
          set -euo pipefail
          {
            echo "## Tenant de demostración reseteado"
            echo
            echo "Credenciales y qué es demostrable: \`docs/demo-tenant.md\`."
            echo "La contraseña **no** se imprime aquí ni en ningún log: vive sólo en el OCI Vault."
            echo
            if grep -q 'guest portal for the active stay' "$RUNNER_TEMP/demo-reset.out"; then
              echo "### Portal de huésped de la estancia activa"
              echo
              echo '```'
              grep 'guest portal for the active stay' "$RUNNER_TEMP/demo-reset.out" | sed 's/^demo_reset: //'
              echo '```'
              echo
              echo "Muere en el reset siguiente: cada ejecución acuña uno nuevo y revoca el anterior."
            else
              echo "_El comando no emitió enlace de portal en esta ejecución._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # El token del portal es la excepción única de R2.5 (D19), y su acotamiento se apoya en que
      # el resumen del job sea el ÚNICO canal por el que llega a alguien. El fichero intermedio no
      # puede sobrevivir al job: el workspace del runner self-hosted es compartido y persistente,
      # así que un `tee` sin borrado deja un token vivo legible en la máquina hasta el reset
      # siguiente. Va en `RUNNER_TEMP` (que GitHub limpia entre jobs) y además se borra aquí de
      # forma explícita, con `if: always()` para que un reset en rojo tampoco lo deje atrás.
      - name: Borrar la salida intermedia, que lleva el token del portal
        if: always()
        run: rm -f "$RUNNER_TEMP/demo-reset.out"
