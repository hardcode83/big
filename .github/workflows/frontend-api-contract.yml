name: frontend-api-contract

# Comprueba que los tipos TypeScript versionados siguen siendo la salida del contrato OpenAPI.
# Es una señal independiente de frontend-tests y se ejecuta sin filtros de paths.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: frontend-api-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias desde el lockfile
        working-directory: frontend
        run: npm ci

      - name: Comprobar deriva del contrato OpenAPI
        working-directory: frontend
        run: npm run api:check
