name: frontend-tests

# Gate reproducible para la calidad del frontend. Se ejecuta sin filtros de paths para que el
# check exista en todos los Pull Requests: un check requerido con filtro de rutas no se
# ejecuta en los PR que no las tocan, y GitHub los deja bloqueados esperando para siempre.
#
# Nota de coherencia: la comparación "igual que backend-tests" ya no es exacta. Desde el
# change `ci-backend-tests-conditional-gate`, backend-tests reporta su check en todos los PR
# pero solo ejecuta la suite cuando el diff toca `backend/**`, porque tardaba ~6 minutos —y
# llegó a tardar 15m54s antes de que `backend-suite-runtime` la bajara a ~2m44s—.
# Aquí no se ha replicado **a propósito**: este workflow tarda ~1m30-2m15, y ese patrón
# cuesta tres jobs. Es una decisión revisable, no un olvido — si el frontend crece hasta
# doler, backend-tests.yml es el precedente a copiar.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provenance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Version parity
        run: make check-version-parity
      - name: Pull request extractor self-test
        run: bash .github/scripts/extract-pr.sh --self-test
      - name: Provenance producer contract self-test
        run: python3 scripts/validate-provenance-contract.py --self-test
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generated API contract and provenance disclosure tests
        working-directory: frontend
        run: npm run api:check && npm test -- --run features/provenance
      - name: Production build and public artifact disclosure gate
        working-directory: frontend
        run: |
          set -euo pipefail
          export APP_PROVENANCE_REPOSITORY_URL='https://github.com/private-sentinel/repository'
          export APP_PROVENANCE_PULL_REQUEST_NUMBER='987654321'
          export APP_PROVENANCE_COMMIT_SHA='dddddddddddddddddddddddddddddddddddddddd'
          export APP_PROVENANCE_ACTIONS_RUN_ID='876543210'
          npm run build
          npm run test:public-artifacts

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Los pasos posteriores no necesitan Git autenticado; no dejar el token
          # disponible para lifecycle scripts o comandos controlados por un PR.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Misma autoridad que las dos etapas node:22-slim del Dockerfile.
          node-version: "22"
          # Cachea descargas de npm, nunca node_modules; npm ci sigue siendo limpio.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias desde el lockfile
        id: install
        working-directory: frontend
        run: npm ci

      - name: Tests (Vitest)
        id: tests
        if: ${{ steps.install.outcome == 'success' && !cancelled() }}
        continue-on-error: true
        working-directory: frontend
        # `next-env.d.ts` es un fichero gitignored que Next.js genera en el
        # primer `next dev`/`next build`. El guard de `test/color-tokens.test.ts`
        # lo lista entre los ficheros sueltos de la raíz del frontend, así
        # que en CI hay que crearlo explícitamente antes de los tests para
        # que la aserción cuadre tanto en local como en el runner. El
        # contenido se limita a la plantilla que emite `next` y al `routes.d.ts`
        # generado bajo `.next/dev/types/`, así que también se siembra ese
        # directorio vacío para que el `import` resuelva.
        run: |
          mkdir -p .next/dev/types
          printf '%s\n' \
            '/// <reference types="next" />' \
            '/// <reference types="next/image-types/global" />' \
            'import "./.next/dev/types/routes.d.ts";' \
            '' \
            '// NOTE: This file should not be edited' \
            '// see https://nextjs.org/docs/app/api-reference/config/typescript for more information.' \
            > next-env.d.ts
          : > .next/dev/types/routes.d.ts
          npm test

      - name: Lint (ESLint)
        id: lint
        if: ${{ steps.install.outcome == 'success' && !cancelled() }}
        continue-on-error: true
        working-directory: frontend
        run: npm run lint

      - name: Typecheck (TypeScript)
        id: typecheck
        if: ${{ steps.install.outcome == 'success' && !cancelled() }}
        continue-on-error: true
        working-directory: frontend
        run: npm run typecheck

      - name: Consolidar resultados
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Frontend checks"
            echo ""
            echo "| Verificación | Resultado |"
            echo "|---|---|"
            echo "| npm ci | ${INSTALL_OUTCOME:-not-run} |"
            echo "| Tests (Vitest) | ${TESTS_OUTCOME:-not-run} |"
            echo "| Lint (ESLint) | ${LINT_OUTCOME:-not-run} |"
            echo "| Typecheck (TypeScript) | ${TYPECHECK_OUTCOME:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$INSTALL_OUTCOME" != "success" ] || \
             [ "$TESTS_OUTCOME" != "success" ] || \
             [ "$LINT_OUTCOME" != "success" ] || \
             [ "$TYPECHECK_OUTCOME" != "success" ]; then
            echo "::error::Una o más verificaciones del frontend fallaron, se cancelaron o no llegaron a ejecutarse."
            exit 1
          fi
