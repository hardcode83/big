services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Acotado a loopback: sin el prefijo, Docker publica en 0.0.0.0 y la base de datos
      # queda alcanzable desde cualquier host de la red a la que esté conectada esta
      # máquina. El puerto sigue disponible para las herramientas locales (clientes
      # gráficos, y la suite ejecutada en el host, que cae a localhost:5432).
      # `DATABASE_URL` no pasa por aquí: los contenedores van por `postgres:5432` a
      # través de la red de compose, que es un camino distinto y no se ve afectado.
      #
      # Este mapeo (y los otros tres de este fichero) lo RETIRA `docker-compose.worktree.yml`
      # cuando el stack se levanta desde un worktree enlazado, para que dos stacks convivan sin
      # chocar de puertos. Aquí sigue declarado a propósito: el worktree principal es el que
      # publica, y es esta declaración la que describe la postura de red del proyecto.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      # Acotado a loopback, y aquí no es sólo higiene. Este Redis guarda los contadores
      # del throttle de login (`login:ip:*`, `login:fail:*`, `login:lock:*`, ver
      # backend/app/auth/infrastructure/throttle.py): quien lo alcance puede borrarlos
      # entre intentos y entonces el límite de 10/min por IP y el bloqueo tras 10 fallos
      # que exige la regla 7 de sdd/steering/security.md no se disparan nunca.
      #
      # La defensa es ESTE BIND, no la autenticación: el servicio corre sin `requirepass`
      # y no hay contraseña de Redis en ninguna parte del repositorio. Por tanto, exponerlo
      # fuera de loopback exige resolver la autenticación ANTES, no después.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: devops/Dockerfile
      target: dev
    command: uv run alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # alembic/env.py imports app.core.config, which builds Settings at import time, so a
      # missing key fails the migration rather than the first credential read. `env_file`
      # would already carry it; the `:?` is what turns a hand-rolled .env into a loud error.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env (make up la genera)}
    volumes:
      - ./backend:/app
      - migrate_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: devops/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Generated into .env by `make up` (never versioned — steering/security.md #8).
      # The `:?` makes a hand-rolled .env without it fail loudly instead of letting
      # the app boot with an empty signing key.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY en .env (make up la genera)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env (make up la genera)}
      # Almacén de objetos (change `object-storage-provisioning`). Solo en `backend`, igual que el
      # volumen de medios de abajo y por el mismo motivo: es el único servicio que sube y sirve
      # ficheros.
      #
      # Sin `:?` a propósito, al contrario que las dos de arriba: aquí el default vacío es el
      # comportamiento correcto. El MVP local corre sobre `LOCAL` y estas cinco no hacen falta —
      # exigirlas rompería `make up` para todo el mundo a cambio de nada.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      # The provenance wiring regression reads the production workflow as an executable
      # contract. Keep the host workflow visible read-only so the project test command works
      # both locally and in CI without embedding a duplicate fixture in backend/.
      - ./.github/workflows/deploy-dev.yml:/workspace/deploy-dev.yml:ro
      # Same contract, one change later (`demo-user`): the scheduled reset's workflow is read as
      # an executable contract too, because the link it publishes reaches the job summary by
      # grepping the command's stdout — a seam nothing but a string connects. Without this the
      # tests that pin it would skip locally and only run in CI, which is the state
      # `tests/auth/test_bootstrap.py` warned about when it declined to write a test it could not
      # run where the suite runs.
      - ./.github/workflows/demo-reset.yml:/workspace/demo-reset.yml:ro
      # Third instance of the same contract, one change later (`demo-user`): R2.1 says the
      # demo password has no default anywhere in the tree, and half of that claim is that
      # `.env.example` declares DEMO_ACCOUNT_PASSWORD by name with no value. Asserting it needs
      # to READ the file, and the repo root is not mounted. Without this line the test could
      # only run in CI, where the checkout is complete — and a test that cannot run where the
      # suite runs is worse than none (`tests/auth/test_bootstrap.py` said so when it declined
      # to write it).
      #
      # Read-only, and it discloses strictly less than this container already holds: `backend`
      # receives the real `.env` through `env_file` and a `DATABASE_URL` with the actual
      # POSTGRES_PASSWORD interpolated into it. The example file carries names without values
      # except for the handful of avowedly local defaults rule 8 permits (`localdev`), so it
      # adds nothing to the blast radius of the service that publishes 8000 on every interface.
      - ./.env.example:/workspace/.env.example:ro
      # Fotos de limpieza y demás ficheros subidos (change `cleaning-photos-storage`, R1.3).
      # Volumen con nombre y NO un bind mount del árbol: `/app` es el repositorio por el bind
      # de arriba, así que sin este volumen las fotos aparecerían en `git status`. El
      # `LocalFileStorage` escribe exactamente aquí (`MEDIA_ROOT = /app/media`).
      #
      # Va montado solo en `backend`: es el único servicio que sube y sirve ficheros. `worker`
      # y `beat` no tocan almacenamiento hoy, y montarles el volumen "por si acaso" sería
      # ampliar el radio de escritura sin ningún llamante.
      #
      # Coste que conviene saber: `docker compose down -v` se lleva las fotos. Es dev, pero es
      # mejor leerlo aquí que descubrirlo.
      - backend_media:/app/media
    ports:
      # Publicado en todas las interfaces A PROPÓSITO, al contrario que `postgres` y
      # `redis`. Vale igual para el `3000` de `frontend`, y es ahí donde está el motivo:
      # el proyecto es mobile-first, así que comprobar el diseño exige abrir la app desde
      # un móvil real por la IP de LAN de esta máquina. Acotar el `3000` a loopback
      # eliminaría esa vía, y acotar sólo el `8000` dejaría media app inalcanzable desde
      # ese mismo móvil.
      #
      # Lo que esto expone, dicho sin adornos: la UI y la API de un stack de desarrollo con
      # datos de prueba, a quien comparta red con esta máquina. Lo que NO expone es acceso
      # directo al datastore — esa es la diferencia que introduce el acotado de `postgres`
      # y `redis`, y por eso el stack local NO es "inalcanzable desde la red": estos dos
      # puertos sí lo son.
      #
      # Ojo si añades otro puerto aquí: la excepción es de ESTE par servicio+puerto, no del
      # servicio entero. Cualquier otro mapeo de `backend` debería llevar el prefijo
      # `127.0.0.1:` salvo que tenga su propio motivo escrito. Lo mismo con `frontend:3000`.
      #
      # Y si añades un mapeo a CUALQUIER servicio, añádelo también a
      # `docker-compose.worktree.yml`, que es el fichero que los retira en un worktree
      # enlazado. `make up` allí lo comprueba y aborta si queda alguno publicado.
      #
      # Y ESTE MAPEO ES LA RAZÓN POR LA QUE EN LOCAL NO SE CONFÍA EN NINGUNA CABECERA DE
      # PROXY (change `api-ingress-routing`, design D7). El camino `/api/` del frontend
      # existe igual aquí que en el despliegue —misma URL relativa, mismo handler—, pero
      # `--forwarded-allow-ips` NO se configura en este fichero, a diferencia de
      # `docker-compose.deploy.yml`. El motivo es exactamente el párrafo de arriba: con
      # `8000` publicado a la LAN, la cabecera la pone quien llama, así que confiar en
      # ella le daría a cualquiera que comparta red con esta máquina un presupuesto nuevo
      # de 10 intentos/min en cada petición. Aquí manda el peer del socket: el throttle
      # degrada a "un contador para todo el stack", que es el precio correcto en un
      # entorno sin datos reales.
      #
      # El flag va pineado a `127.0.0.1` en el Dockerfile, y no simplemente omitido, por
      # una razón concreta: uvicorn cae a la variable de entorno `FORWARDED_ALLOW_IPS`
      # cuando el flag falta (`uvicorn/config.py:356`). Y este servicio recibe el `.env`
      # entero por `env_file`, así que un `FORWARDED_ALLOW_IPS=*` añadido ahí mientras se
      # depura algo abriría exactamente el bypass de arriba. El flag del CLI gana.
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: devops/Dockerfile
      target: dev
    restart: unless-stopped
    command: uv run celery -A app.worker worker -l info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY en .env (make up la genera)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env (make up la genera)}
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    # El scheduler de `celery-jobs`: dispara las cuatro tareas de PRD §8.3.
    #
    # Servicio propio y no `worker --beat`: con más de un worker el beat embebido dispararía
    # N veces (design D13).
    #
    # Su fichero de estado (`backend/celerybeat-schedule`) **persiste en el host**, porque el
    # bind mount de abajo hace que `/app` sea el árbol del repositorio. No es efímero, aunque
    # una versión anterior de este comentario lo afirmara: por eso está en `.gitignore`. No
    # afecta a la corrección — las tareas son idempotentes y toman un lock en Redis, así que
    # un reinicio que vuelva a disparar antes de tiempo es inofensivo (R4.1, R4.2).
    build:
      context: ./backend
      dockerfile: devops/Dockerfile
      target: dev
    restart: unless-stopped
    command: uv run celery -A app.worker beat -l info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY en .env (make up la genera)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env (make up la genera)}
    volumes:
      - ./backend:/app
      - beat_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: devops/Dockerfile
      target: dev
    restart: unless-stopped
    # No `env_file: .env` on purpose: .env now carries backend-only secrets
    # (JWT_SECRET_KEY, BOOTSTRAP_*_PASSWORD) and the frontend has no business
    # holding the token signing key. Same posture as docker-compose.deploy.yml,
    # which also lists the frontend's variables explicitly.
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      # Identidad de build en dev local (change app-version-visibility). Declaradas una a
      # una porque este servicio NO tiene `env_file` a propósito (el .env lleva
      # JWT_SECRET_KEY y BOOTSTRAP_*_PASSWORD, que el frontend no debe ver).
      #
      # En dev el target es `dev`: corre `npm run dev` y nunca ejecuta `npm run build`, así
      # que aquí no hay nada horneado. Los defaults dejan el badge diciendo "local" en vez
      # de fingir una versión desplegada.
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-local}
      NEXT_PUBLIC_BUILD_COMMIT_SHORT: ${NEXT_PUBLIC_BUILD_COMMIT_SHORT:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      # En todas las interfaces a propósito: es este puerto el que se abre desde un móvil
      # real por la IP de LAN. Razonamiento completo (y qué queda expuesto) junto al `8000`
      # de `backend`, para no tener dos copias que se desincronicen.
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  backend_media:
  backend_venv:
  worker_venv:
  beat_venv:
  migrate_venv:
  frontend_node_modules:
  frontend_next:
