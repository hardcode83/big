[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    # Declarado explícitamente aunque ya venga por fastapi/starlette: el adaptador de
    # bcrypt lo importa directo (`anyio.to_thread`, design D21), y depender de una
    # transitiva es romperse el día que la dependencia de arriba la cambie.
    "anyio>=4.0",
    "asyncpg>=0.31.0",
    "bcrypt>=4.2",
    # Runtime dependency, not dev, and for the reason `httpx` and `cryptography` below each
    # learned the hard way: `S3FileStorage` is production code on the photo upload path
    # (`app/integrations/infrastructure/storage/s3.py`), and `devops/Dockerfile`'s prod stage
    # installs with `uv sync --frozen --no-dev`, so a dev-group boto3 would be missing from the
    # deployed image while the suite stayed green.
    #
    # EXTERNAL_DEPENDENCY: no AWS account backs this project, so the adapter is validated
    # against the port contract and a stub client, never against S3 itself.
    "boto3>=1.35",
    "celery>=5.6.3",
    # Runtime dependency, not dev: `app/core/crypto.py` decrypts provider credentials on the
    # sync path, so a dev-group `cryptography` would be absent from the deployed image —
    # `devops/Dockerfile`'s prod stage installs with `uv sync --frozen --no-dev`. Same trap
    # that `httpx` fell into below, and the same reason it is spelled out here.
    "cryptography>=44.0",
    "fastapi>=0.139.0",
    # Runtime dependency since `channex-staging-adapter` (design D4): `ChannexAdapter`
    # talks HTTP in production code, so a dev-group httpx would be absent from the
    # deployed image — `devops/Dockerfile`'s prod stage installs with
    # `uv sync --frozen --no-dev`. It was already here for the test client, which is
    # what made the gap easy to miss: the suite passed and the image would not have run.
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10",
    # Required by FastAPI to parse `multipart/form-data`, which is how the CSV reservation
    # import receives its file (R4). Without it the route raises at import time, not at
    # request time — a missing dependency here takes the whole app down.
    "python-multipart>=0.0.20",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0",
    # Declarado explícitamente por el mismo motivo que `anyio` arriba: hoy entra por
    # `celery` → `kombu`, y `app/tenants/domain/value_objects.py` valida `timezone` con
    # `zoneinfo`, que necesita la base de datos IANA.
    #
    # Matiz que corrigió el panel de QA de `user-management`: en `python:3.12-slim` la zona
    # **la aporta hoy el paquete `tzdata` del sistema operativo** (`/usr/share/zoneinfo`), que
    # `zoneinfo` consulta ANTES de caer al paquete PyPI. Así que declararlo no es lo que hace
    # que funcione ahora — es el seguro para una imagen que no lo traiga (distroless, o un
    # cambio en la base), y por eso su test comprueba la metadata del paquete y no solo que
    # las zonas resuelvan: eso último pasaría igual sin la dependencia.
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
]
